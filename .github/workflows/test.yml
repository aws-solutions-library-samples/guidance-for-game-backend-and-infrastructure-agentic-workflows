name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Scheduled vulnerability scan of main: grype's advisory DB updates daily, so
  # a new GHSA against deps already in our lockfiles can start failing PRs at
  # any time (e.g. GHSA-29w2-fq35-v728 / #247). The cron catches that within a
  # day and opens an issue, instead of surfacing as a red X on whoever happens
  # to open the next PR. Test jobs are gated off `schedule` — only the scan runs.
  schedule:
    - cron: '0 15 * * 1-5'   # weekdays 8am PT (15:00 UTC)
  workflow_dispatch:

# Least-privilege default token: jobs only read repo contents. Tightens the
# GITHUB_TOKEN from the broad default (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  backend-tests:
    # Scheduled runs are vulnerability-scan only (code didn't change; deps didn't
    # change; only grype's advisory DB did).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Verify deployment requirements match lockfile
      working-directory: ./backend
      shell: bash
      run: |
        uv export --frozen --format requirements-txt --no-dev --no-hashes \
          --output-file /tmp/backend-requirements.txt > /dev/null
        diff -u \
          <(grep -Ev '^[[:space:]]*(#|$)' requirements.txt) \
          <(grep -Ev '^[[:space:]]*(#|$)' /tmp/backend-requirements.txt)

    - name: Run repository script tests
      run: python3 -m unittest discover -s scripts/test -p 'test_*.py' -v

    - name: Scan tracked public content
      run: python3 scripts/check_public_content.py

    - name: Install dependencies
      working-directory: ./backend
      run: uv sync

    - name: Run backend unit tests
      working-directory: ./backend
      run: uv run pytest -m unit -v --tb=short

  frontend-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './ui/package-lock.json'

    - name: Install dependencies
      working-directory: ./ui
      run: npm ci

    - name: Run frontend unit tests
      working-directory: ./ui
      run: npm test -- --passWithNoTests --watchAll=false

    - name: Lint
      working-directory: ./ui
      run: npm run lint

  e2e-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Official Playwright image (Microsoft Container Registry CDN) ships
    # browsers + all system libraries pre-installed. Pinned to the
    # @playwright/test version in ui/package-lock.json — bump in lockstep.
    # Avoids `playwright install --with-deps`, which apt-installs ~80 system
    # libs from the (slow/flaky) Azure Ubuntu mirror on every run.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # --ignore-scripts skips the postinstall playwright-install hook (the apt
    # path); browsers are already in the image. Mirrors ui/Dockerfile.
    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci --ignore-scripts

    - name: Build frontend
      working-directory: ./ui
      run: npm run build

    # The build-manifest backstop in the no-admin regression suite only has a
    # `.next` to inspect after the build above. Run it here with the manifest
    # required so a build that somehow emitted an `/admin/*` route — or no page
    # manifest at all — fails the job.
    - name: Verify build exposes no admin route
      working-directory: ./ui
      run: npx jest --ci src/__tests__/no-admin-user-management.test.ts
      env:
        REQUIRE_NEXT_BUILD_MANIFEST: 'true'

    # The bundle budget needs a build to measure, so it runs here (not in the
    # build-free unit jobs): it fails the build if a current-UI page gains
    # Cloudscape code/CSS or grows past its per-page ceiling.
    - name: Check bundle budget
      working-directory: ./ui
      run: node scripts/measure-bundles.mjs

    - name: Run E2E smoke tests
      working-directory: ./ui
      run: npx playwright test tests/e2e-smoke.spec.ts
      env:
        NEXT_PUBLIC_SKIP_AUTH: 'true'

    # The Cloudscape shell suite (ADR 0007): the shell served through the
    # server-side selector, light, dark, and system themes, axe checks, and the
    # cross-shell navigation that must never mix design systems. Its config
    # serves `next dev` on 127.0.0.1:3100 with its own selector and skip-auth
    # settings, so it does not share the smoke tests' server.
    - name: Run Cloudscape shell browser tests
      working-directory: ./ui
      run: npx playwright test -c playwright.cloudscape.config.ts

    - name: Upload E2E test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: playwright-report
        path: ui/playwright-report/
        retention-days: 14

  vulnerability-scan:
    runs-on: ubuntu-latest
    outputs:
      scan-outcome: ${{ steps.scan.outcome }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Official Anchore actions install pinned syft + grype binaries (no curl|sh).
    # They install into a temp dir and expose the path via the `cmd` output —
    # they do NOT add it to PATH for later `run:` steps, so we do that ourselves
    # below (otherwise scan-vulnerabilities.sh's bare `grype`/`syft` calls fail
    # with "not found").
    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

    - name: Install Grype
      id: grype
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

    - name: Add syft + grype to PATH
      run: |
        dirname "${{ steps.syft.outputs.cmd }}" >> "$GITHUB_PATH"
        dirname "${{ steps.grype.outputs.cmd }}" >> "$GITHUB_PATH"

    # Keep the source/lockfile scans and also scan the final frontend image:
    # its base OS and bundled tooling are absent from package-lock.json.
    # The same High/Critical gate and scheduled alert cover both artifacts.
    - name: Scan dependencies and runtime image for vulnerabilities
      id: scan
      # Explicit `shell: bash` enables pipefail (the implicit default `bash -e`
      # does not) — without it, `| tee` would mask the scan's failing exit code.
      shell: bash
      run: |
        {
          bash scripts/scan-vulnerabilities.sh &&
            docker build --platform linux/amd64 --target runner \
              --tag "$FRONTEND_SCAN_IMAGE" ui &&
            syft "docker:$FRONTEND_SCAN_IMAGE" \
              -o spdx-json=sbom/frontend-runtime-sbom.spdx.json \
              --source-name game-agent-frontend-runtime &&
            grype sbom:sbom/frontend-runtime-sbom.spdx.json --fail-on "$FAIL_ON"
        } 2>&1 | tee /tmp/scan-output.txt
      env:
        FAIL_ON: high
        FRONTEND_SCAN_IMAGE: game-agent-frontend-scan:ci

    - name: Upload vulnerability SBOMs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vulnerability-sboms
        path: sbom/*.spdx.json
        retention-days: 7

    - name: Upload failed scheduled scan output
      if: ${{ always() && github.event_name == 'schedule' && steps.scan.outcome == 'failure' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vulnerability-scan-output
        path: /tmp/scan-output.txt
        retention-days: 7

  vulnerability-alert:
    needs: vulnerability-scan
    if: ${{ always() && github.event_name == 'schedule' && needs.vulnerability-scan.outputs.scan-outcome == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Download scan output
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: vulnerability-scan-output
        path: /tmp

    # A failed scheduled scan means a new high/critical advisory now matches
    # dependencies already on main. Surface it as a labeled issue (refreshed in
    # place, not duplicated) instead of a red X nobody is watching for.
    - name: Open or update alert issue (scheduled runs)
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        TITLE="Scheduled vulnerability scan: high/critical findings on main"
        BODY_FILE=$(mktemp)
        {
          echo "The scheduled grype scan found high/critical vulnerabilities in dependencies currently on \`main\`."
          echo "Until fixed, the required \`vulnerability-scan\` check will fail on every PR."
          echo ""
          echo "Run: $RUN_URL"
          echo ""
          echo '```'
          grep -iE 'high|critical|vulnerab|GHSA|CVE' /tmp/scan-output.txt | head -50 || tail -50 /tmp/scan-output.txt
          echo '```'
          echo ""
          echo "Fix guidance: update the affected source dependency (pyproject.toml + uv.lock + regenerated requirements.txt, or ui/package.json + package-lock.json) or final runtime image dependency in ui/Dockerfile — do not add grype ignore rules."
        } > "$BODY_FILE"
        EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
        if [ -n "$EXISTING" ]; then
          gh issue comment --repo "$GITHUB_REPOSITORY" "$EXISTING" --body-file "$BODY_FILE"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label security --body-file "$BODY_FILE"
        fi

  powershell-tests:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # pwsh (PowerShell 7) is preinstalled on both ubuntu-latest and windows-latest.
    - name: Cache PowerShell modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.local/share/powershell/Modules
          ~/Documents/PowerShell/Modules
        key: psmodules-${{ runner.os }}-pester5

    - name: Install Pester
      shell: pwsh
      run: |
        if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge '5.0.0' })) {
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
        }

    - name: Run Pester tests
      shell: pwsh
      run: |
        Import-Module Pester -MinimumVersion 5.0.0
        $config = New-PesterConfiguration
        $config.Run.Path = 'scripts/powershell/Tests'
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        $config.Should.ErrorAction = 'Stop'
        Invoke-Pester -Configuration $config
