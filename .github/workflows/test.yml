name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default token: jobs only read repo contents. Tightens the
# GITHUB_TOKEN from the broad default (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      working-directory: ./backend
      run: uv sync

    - name: Run backend unit tests
      working-directory: ./backend
      run: uv run pytest -m unit -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './ui/package-lock.json'

    - name: Install dependencies
      working-directory: ./ui
      run: npm ci

    - name: Run frontend unit tests
      working-directory: ./ui
      run: npm test -- --passWithNoTests --watchAll=false

    - name: Lint
      working-directory: ./ui
      run: npm run lint

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    # Official Playwright image (Microsoft Container Registry CDN) ships
    # browsers + all system libraries pre-installed. Pinned to the
    # @playwright/test version in ui/package-lock.json — bump in lockstep.
    # Avoids `playwright install --with-deps`, which apt-installs ~80 system
    # libs from the (slow/flaky) Azure Ubuntu mirror on every run.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble

    steps:
    - uses: actions/checkout@v7

    # --ignore-scripts skips the postinstall playwright-install hook (the apt
    # path); browsers are already in the image. Mirrors ui/Dockerfile.
    - name: Install frontend dependencies
      working-directory: ./ui
      run: npm ci --ignore-scripts

    - name: Build frontend
      working-directory: ./ui
      run: npm run build

    - name: Run E2E smoke tests
      working-directory: ./ui
      run: npx playwright test tests/e2e-smoke.spec.ts
      env:
        NEXT_PUBLIC_SKIP_AUTH: 'true'

    - name: Upload E2E test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: ui/playwright-report/
        retention-days: 14

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Official Anchore actions install pinned syft + grype binaries (no curl|sh).
    # They install into a temp dir and expose the path via the `cmd` output —
    # they do NOT add it to PATH for later `run:` steps, so we do that ourselves
    # below (otherwise scan-vulnerabilities.sh's bare `grype`/`syft` calls fail
    # with "not found").
    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Install Grype
      id: grype
      uses: anchore/scan-action/download-grype@v7

    - name: Add syft + grype to PATH
      run: |
        dirname "${{ steps.syft.outputs.cmd }}" >> "$GITHUB_PATH"
        dirname "${{ steps.grype.outputs.cmd }}" >> "$GITHUB_PATH"

    # scripts/scan-vulnerabilities.sh generates SBOMs (syft dir:backend, dir:ui —
    # reads uv.lock / package-lock.json, no build needed) then greps them with
    # grype. FAIL_ON=high so the build fails only on high/critical findings;
    # medium/low are surfaced in the log without blocking.
    - name: Scan dependencies for vulnerabilities
      run: bash scripts/scan-vulnerabilities.sh
      env:
        FAIL_ON: high

  powershell-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    # pwsh (PowerShell 7) is preinstalled on both ubuntu-latest and windows-latest.
    - name: Cache PowerShell modules
      uses: actions/cache@v5
      with:
        path: |
          ~/.local/share/powershell/Modules
          ~/Documents/PowerShell/Modules
        key: psmodules-${{ runner.os }}-pester5

    - name: Install Pester
      shell: pwsh
      run: |
        if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge '5.0.0' })) {
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
        }

    - name: Run Pester tests
      shell: pwsh
      run: |
        Import-Module Pester -MinimumVersion 5.0.0
        $config = New-PesterConfiguration
        $config.Run.Path = 'scripts/powershell/Tests'
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        $config.Should.ErrorAction = 'Stop'
        Invoke-Pester -Configuration $config
