# Manual, immutable milestone release workflow.
#
# This workflow NEVER deploys to AWS and NEVER uses AWS credentials. It records
# an exact, accepted `main` source state as an annotated tag plus a GitHub
# Release carrying only public-safe, deterministic artifacts. See
# docs/RELEASING.md for the full policy, the evidence-comment format, and the
# maintainer settings this workflow deliberately does not change.
#
# Every dispatch input reaches the Python tooling through `env:` only; nothing
# is interpolated into a `run:` command line.
#
# Trust boundary between the two artifact jobs:
#   * `build-artifacts` holds a READ-ONLY token. It runs the third-party syft
#     action, builds the artifact set TWICE in independent temp directories,
#     fails unless the two builds are byte-identical, and uploads the verified
#     set as a workflow artifact.
#   * `publish` holds `contents: write`. It uses ONLY first-party `actions/*`
#     actions plus the stdlib tooling: it downloads the verified set, re-checks
#     it against SHA256SUMS and the manifest identity, re-runs the live
#     pre-write validations, verifies the `release` environment is protected,
#     and publishes exactly those bytes. No syft and no SBOM regeneration run
#     beside the write token.
#
# Every job also runs only when the dispatch ref is `main`: the workflow file
# itself comes from the dispatch ref, so the scripts' commit==main check is not
# sufficient on its own.

name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-hex commit SHA on main to release."
        required: true
        type: string
      tag:
        description: "Release tag: vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N."
        required: true
        type: string
      evidence_comment_url:
        description: "Permalink of the deployed-validation evidence comment on an issue in THIS repository."
        required: true
        type: string
      dry_run:
        description: "Validate and build artifacts without creating any tag or release."
        required: true
        type: boolean
        default: true

# Deny-by-default: no token scopes at the top level. Each job opts into the
# least privilege it needs.
permissions: {}

# Serialize releases; never cancel an in-flight release run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    # The workflow file comes from the dispatch ref; only ever run from main.
    # The commit==github.sha binding is enforced by the explicit shell guard
    # step below (and gates build-artifacts and publish), NOT by this job-level
    # condition: a false condition would skip the job silently, so the guard
    # must stay reachable to fail loudly on a stale or mistyped SHA.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the release commit; read tags/refs/releases
      checks: read # read required-check runs on the commit
      issues: read # read the deployed-validation evidence comment
      actions: read # read the release environment's protection rules (dry-run visibility)
    outputs:
      commit_date: ${{ steps.resolve.outputs.commit_date }}
    env:
      GBAW_RELEASE_COMMIT: ${{ inputs.commit }}
      GBAW_RELEASE_TAG: ${{ inputs.tag }}
      GBAW_RELEASE_EVIDENCE_URL: ${{ inputs.evidence_comment_url }}
      GBAW_RELEASE_REPO: ${{ github.repository }}
    steps:
      - name: Verify dispatched commit equals the ref the workflow came from
        # Bind the dispatched commit to the protected main HEAD the workflow
        # file itself came from, so release tooling cannot be supplied from a
        # non-main (e.g. PR head) commit under test. This is the authoritative
        # commit==github.sha gate for the validate job: it runs LOUDLY before
        # checkout so a stale or mistyped SHA fails the run instead of skipping
        # every job silently. It runs no code from the dispatched commit; the
        # shell comparison is case-sensitive, unlike the expression comparison.
        # The dispatched value stays in the environment and is NEVER
        # interpolated into the output: the ::error:: line names only
        # $GITHUB_SHA (the trusted, server-owned main HEAD), so a value
        # dispatched through the REST API -- even one containing a newline and a
        # forged ::warning:: or ::add-mask:: line -- cannot reach stdout and
        # cannot inject a workflow command.
        env:
          GBAW_RELEASE_COMMIT: ${{ inputs.commit }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$GBAW_RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::dispatched commit does not equal main HEAD $GITHUB_SHA"
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Resolve commit date
        id: resolve
        run: |
          commit_date="$(git show -s --format=%cI HEAD)"
          echo "commit_date=${commit_date}" >> "$GITHUB_OUTPUT"

      - name: Validate release preconditions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # exec replaces the bash -e wrapper with Python so a cancelled step's
        # SIGINT/SIGTERM reach the tooling directly instead of only the shell.
        run: exec python3 -m release.cli validate
        working-directory: scripts

      # Surface a missing/unprotected release environment early (fail closed),
      # so a dry run reports it before the publish stage. The publish job runs
      # this same check again before any write (defense in depth). A draft that
      # already holds the tag is only visible with push access, so draft-held
      # tags are still detected at publish time, not here.
      - name: Verify environment protection (early, read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: exec python3 -m release.cli verify-environment
        working-directory: scripts

  build-artifacts:
    name: build-artifacts
    if: ${{ github.ref == 'refs/heads/main' && inputs.commit == github.sha }}
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read # checkout the release commit; read-only token beside syft
      checks: read # re-run validation reads required-check runs
      issues: read # re-run validation reads the evidence comment
    env:
      GBAW_RELEASE_COMMIT: ${{ inputs.commit }}
      GBAW_RELEASE_TAG: ${{ inputs.tag }}
      GBAW_RELEASE_EVIDENCE_URL: ${{ inputs.evidence_comment_url }}
      GBAW_RELEASE_REPO: ${{ github.repository }}
      GBAW_RELEASE_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Generate SBOMs from source lockfiles WITHOUT installing dependencies, in
      # TWO independent runs into separate directories. syft reads uv.lock /
      # package-lock.json directly. $RUNNER_TEMP is always available; the raw
      # SBOM paths are confined to it.
      - name: Generate source SBOMs (build 1)
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-1"
          "$SYFT_CMD" "dir:backend" -o spdx-json="$RUNNER_TEMP/sbom-1/backend-sbom.raw.spdx.json" --source-name game-agent-backend
          "$SYFT_CMD" "dir:ui" -o spdx-json="$RUNNER_TEMP/sbom-1/frontend-sbom.raw.spdx.json" --source-name game-agent-frontend

      - name: Generate source SBOMs (build 2)
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-2"
          "$SYFT_CMD" "dir:backend" -o spdx-json="$RUNNER_TEMP/sbom-2/backend-sbom.raw.spdx.json" --source-name game-agent-backend
          "$SYFT_CMD" "dir:ui" -o spdx-json="$RUNNER_TEMP/sbom-2/frontend-sbom.raw.spdx.json" --source-name game-agent-frontend

      - name: Build deterministic artifacts (fail unless two builds match)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GBAW_RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-artifacts
          GBAW_RELEASE_BACKEND_SBOM: ${{ runner.temp }}/sbom-1/backend-sbom.raw.spdx.json
          GBAW_RELEASE_FRONTEND_SBOM: ${{ runner.temp }}/sbom-1/frontend-sbom.raw.spdx.json
          GBAW_RELEASE_BACKEND_SBOM_2: ${{ runner.temp }}/sbom-2/backend-sbom.raw.spdx.json
          GBAW_RELEASE_FRONTEND_SBOM_2: ${{ runner.temp }}/sbom-2/frontend-sbom.raw.spdx.json
        run: exec python3 -m release.cli build-artifacts
        working-directory: scripts

      - name: Upload release artifacts (workflow artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: publish
    # Publication runs ONLY on a non-dry-run dispatch from main, and only after
    # validation and the verified artifact build succeeded.
    if: ${{ github.ref == 'refs/heads/main' && inputs.commit == github.sha && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    needs: [validate, build-artifacts]
    # `environment: release` lets maintainers require manual approval before the
    # first real publish. Maintainers must create and protect this environment
    # (required reviewers) before any run, dry or not; the verify-environment
    # step below fails closed if they have not (see docs/RELEASING.md).
    environment: release
    permissions:
      contents: write # create the tag object/ref and the release, upload assets
      checks: read # re-run validation reads required-check runs before writing
      issues: read # re-run validation reads the evidence comment before writing
      actions: read # verify the release environment's protection rules
    env:
      GBAW_RELEASE_COMMIT: ${{ inputs.commit }}
      GBAW_RELEASE_TAG: ${{ inputs.tag }}
      GBAW_RELEASE_EVIDENCE_URL: ${{ inputs.evidence_comment_url }}
      GBAW_RELEASE_REPO: ${{ github.repository }}
      GBAW_RELEASE_DRY_RUN: ${{ inputs.dry_run }}
      GBAW_RELEASE_COMMIT_DATE: ${{ needs.validate.outputs.commit_date }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts

      # Fail closed before any write unless the `release` environment exists and
      # carries a required-reviewers protection rule.
      - name: Verify environment protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: exec python3 -m release.cli verify-environment
        working-directory: scripts

      - name: Publish release (immutable tag + assets)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GBAW_RELEASE_INPUT_DIR: ${{ runner.temp }}/release-artifacts
        # exec replaces the bash -e wrapper with Python so a cancelled publish
        # delivers SIGINT/SIGTERM to the publisher, whose handler runs cleanup.
        run: exec python3 -m release.cli publish
        working-directory: scripts
