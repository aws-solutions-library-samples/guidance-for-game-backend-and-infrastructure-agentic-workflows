# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (backend) — managed by uv (pyproject.toml + uv.lock).
  # Must use the "uv" ecosystem, not "pip": the pip ecosystem only updates the
  # generated requirements.txt, which `uv sync` ignores and scripts/deploy.sh
  # regenerates from uv.lock on deploy, so those updates never take effect.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    reviewers:
      - "game-agent-maintainers"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates together
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow both direct and indirect dependency updates
    allow:
      - dependency-type: "all"
    # (Former mcp / eks-mcp-server / core-mcp-server ignores removed: the
    #  upstream eks-mcp-server<->mcp 1.19 incompatibility (awslabs/mcp#1577) is
    #  fixed in eks-mcp-server>=0.1.32, which requires mcp>=1.23.0; and the
    #  unused core-mcp-server dependency was dropped. Let Dependabot track these.)

  # npm dependencies (frontend)
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    reviewers:
      - "game-agent-maintainers"
    labels:
      - "dependencies"
      - "npm"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates together
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Allow both direct and indirect dependency updates
    allow:
      - dependency-type: "all"
    # Automatically rebase PRs when conflicts occur
    rebase-strategy: "auto"

  # Docker base images (frontend)
  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    reviewers:
      - "game-agent-maintainers"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Pin to Node 24 LTS to match CI (test.yml node-version) — patch/minor
    # updates within v24 are allowed; major bumps (e.g. 26) are deliberate.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # (Removed: docker ecosystem for /backend/.bedrock_agentcore/gameagentruntime.
  #  That Dockerfile is generated at deploy time by `agentcore configure` and is
  #  gitignored / never committed, so Dependabot had no file to scan there and
  #  the updater errored. The base image is tracked via the AgentCore toolkit
  #  itself, not this repo.)

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    reviewers:
      - "game-agent-maintainers"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
