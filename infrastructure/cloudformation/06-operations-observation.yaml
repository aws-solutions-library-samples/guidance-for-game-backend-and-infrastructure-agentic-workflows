AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Game Agent - OPTIONAL E1 operations observation control plane (GitHub issue
  #413). Default-disabled: this stack is not wired into deploy-all.sh, and every
  resource is additionally gated on the OperationsEnabled condition
  (OperationsMode defaults to "disabled"), so a deploy with defaults creates
  ZERO E1 resources. Implements the accepted synchronous, read-only GameLift
  observation design in docs/adr/0005-persist-operations-and-recover-workflows.md.
  No provider-write permission, no queue/worker/dead-letter queue, and no Step
  Functions are created.

Parameters:
  ProjectName:
    Type: String
    Default: game-agent
    Description: Project name used for resource naming.

  OperationsMode:
    Type: String
    Default: disabled
    AllowedValues:
      - disabled
      - observe
    Description: >-
      Master enablement for the optional operations control plane. "disabled"
      (the default) creates zero E1 resources even when this stack is deployed.
      "observe" is the only enabled mode for E1: synchronous, read-only GameLift
      observation. Set to "observe" only when an owner explicitly opts in.

  Environment:
    Type: String
    Default: beta
    AllowedValues:
      - beta
      - prod
    Description: >-
      Target environment. "prod" enables DynamoDB deletion protection and a
      longer log-retention posture appropriate to production audit data.

  CognitoIssuer:
    Type: String
    Default: ''
    Description: >-
      JWT issuer URL (Cognito user pool issuer, e.g.
      https://cognito-idp.us-west-2.amazonaws.com/us-west-2_example) bound to the
      HTTP API authorizer. Required when OperationsMode=observe.

  CognitoClientId:
    Type: String
    Default: ''
    Description: >-
      Cognito application client id used as the JWT audience on every route.
      Required when OperationsMode=observe.

  TenantId:
    Type: String
    Default: ''
    Description: >-
      Server-side trusted tenant binding injected into the runtime as
      GBAW_OPERATIONS_TENANT_ID. Required when OperationsMode=observe.

  WorkspaceId:
    Type: String
    Default: ''
    Description: >-
      Server-side trusted workspace binding injected into the runtime as
      GBAW_OPERATIONS_WORKSPACE_ID. Required when OperationsMode=observe.

  TrustedAudience:
    Type: String
    Default: ''
    Description: >-
      Server-side trusted audience the runtime enforces (GBAW_OPERATIONS_TRUSTED_AUDIENCE).
      Defaults to the Cognito client id when left empty at enable time (the
      wrapper supplies it); an explicit value overrides.

  CodeS3Bucket:
    Type: String
    Default: ''
    Description: >-
      S3 bucket holding the packaged operations Lambda artifact. Supplied by the
      deploy wrapper after it builds and uploads a deterministic zip. Required
      when OperationsMode=observe.

  CodeS3Key:
    Type: String
    Default: ''
    Description: >-
      Content-hash-addressed S3 key of the packaged operations Lambda artifact.
      Supplied by the deploy wrapper. Required when OperationsMode=observe.

  RequestDeadlineSeconds:
    Type: Number
    Default: 15
    MinValue: 5
    MaxValue: 29
    Description: >-
      Total observation request budget in seconds (ADR 0005), used ONLY as the
      Lambda function Timeout. It is NOT injected as a runtime environment
      variable: the core settings module derives the effective deadline from the
      per-read + persistence sub-budgets plus the cancellation margin. Bounded
      below the 30 s API Gateway HTTP API integration ceiling so the request
      fails closed before the gateway times out.

  PerReadBudgetSeconds:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 29
    Description: >-
      Per-provider-read sub-budget in seconds (ADR 0005), injected as
      GBAW_OPERATIONS_PER_READ_BUDGET_S. A read that blocks past this bound is
      abandoned and a typed retryable error is raised.

  PersistenceBudgetSeconds:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 29
    Description: >-
      Persistence + canonical serialization sub-budget in seconds (ADR 0005),
      injected as GBAW_OPERATIONS_PERSISTENCE_BUDGET_S.

  CancellationMarginSeconds:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 29
    Description: >-
      Cancellation-margin sub-budget in seconds (ADR 0005), injected as
      GBAW_OPERATIONS_CANCELLATION_MARGIN_S. Reserved headroom so an in-flight
      request is abandoned before the gateway integration ceiling is reached.

  ObservationTtlSeconds:
    Type: Number
    Default: 1800
    MinValue: 60
    Description: >-
      Observation freshness / DynamoDB TTL horizon in seconds for the transient
      observation records, injected as GBAW_OPERATIONS_OBSERVATION_TTL_S (the
      value the handler stamps on the `ttl` attribute). Matches the core default
      (1800 s = 30 min). The audit ledger and idempotency mapping are retained
      for the full audit window and are not TTL-managed.

  LambdaMemoryMb:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 3008
    Description: Lambda memory size (MB); matches the accepted E1 cost model.

  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: >-
      Reserved concurrency cap for the observation function. Bounds blast radius
      and is a denial-of-wallet control.

  MaxReadRequestUnits:
    Type: Number
    Default: 500
    MinValue: 1
    Description: DynamoDB on-demand maximum read request units (denial-of-wallet cap).

  MaxWriteRequestUnits:
    Type: Number
    Default: 200
    MinValue: 1
    Description: DynamoDB on-demand maximum write request units (denial-of-wallet cap).

  ThrottlingBurstLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: HTTP API stage throttling burst limit (denial-of-wallet control).

  ThrottlingRateLimit:
    Type: Number
    Default: 50
    MinValue: 1
    Description: HTTP API stage throttling steady-state rate limit (denial-of-wallet control).

Conditions:
  # Master switch. Every resource references this, so OperationsMode=disabled
  # (the default) provisions nothing.
  OperationsEnabled: !Equals [!Ref OperationsMode, observe]
  IsProd: !Equals [!Ref Environment, prod]
  # An explicit trusted audience overrides the Cognito client id fallback.
  HasExplicitTrustedAudience: !Not [!Equals [!Ref TrustedAudience, '']]

Rules:
  # Enabled-mode validation: when OperationsMode=observe, the enabling inputs
  # must be non-empty so an enabled deploy can never proceed with a missing
  # issuer, audience, tenant, workspace, or code artifact.
  EnabledModeRequiresInputs:
    RuleCondition: !Equals [!Ref OperationsMode, observe]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoIssuer, '']]
        AssertDescription: CognitoIssuer is required when OperationsMode=observe.
      - Assert: !Not [!Equals [!Ref CognitoClientId, '']]
        AssertDescription: CognitoClientId is required when OperationsMode=observe.
      - Assert: !Not [!Equals [!Ref TenantId, '']]
        AssertDescription: TenantId is required when OperationsMode=observe.
      - Assert: !Not [!Equals [!Ref WorkspaceId, '']]
        AssertDescription: WorkspaceId is required when OperationsMode=observe.
      - Assert: !Not [!Equals [!Ref CodeS3Bucket, '']]
        AssertDescription: CodeS3Bucket is required when OperationsMode=observe.
      - Assert: !Not [!Equals [!Ref CodeS3Key, '']]
        AssertDescription: CodeS3Key is required when OperationsMode=observe.

Resources:
  # --------------------------------------------------------------------------- #
  # KMS customer-managed key for at-rest encryption of E1 audit data.
  # The key policy also grants the CloudWatch Logs service principal the
  # encrypt/decrypt actions it needs to write to the CMK-encrypted log groups,
  # scoped to this account's operations log groups.
  # --------------------------------------------------------------------------- #
  OperationsKmsKey:
    Type: AWS::KMS::Key
    Condition: OperationsEnabled
    # RetainExceptOnCreate: keep the CMK on teardown/replacement, but delete it
    # if the stack's initial create rolls back (avoids orphaning an empty key).
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub 'CMK for ${ProjectName} optional operations control plane (E1)'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountManagement
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          # CloudWatch Logs needs the full encrypt/decrypt/describe action set to
          # attach this CMK to a log group; granting only Decrypt+GenerateDataKey
          # is what caused the beta create to fail with AccessDenied at both log
          # groups. These are the documented least-privilege service actions,
          # scoped by encryption context to EXACTLY the two operations log groups
          # (Lambda + API access) via their full ARNs (no account-wide wildcard).
          - Sid: AllowCloudWatchLogsEncryptDecrypt
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'
            Condition:
              ArnEquals:
                'kms:EncryptionContext:aws:logs:arn':
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-operations-observe'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${ProjectName}-operations-access'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-observation
        - Key: CostCenter
          Value: game-operations
        - Key: ManagedBy
          Value: cloudformation

  OperationsKmsAlias:
    Type: AWS::KMS::Alias
    Condition: OperationsEnabled
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-operations'
      TargetKeyId: !Ref OperationsKmsKey

  # --------------------------------------------------------------------------- #
  # DynamoDB: operation-state snapshot, immutable transitions, idempotency
  # mapping, lease, and append-only ledger — single table, PK/SK.
  # --------------------------------------------------------------------------- #
  OperationsTable:
    Type: AWS::DynamoDB::Table
    Condition: OperationsEnabled
    # RetainExceptOnCreate: preserve audit data on teardown/replacement, but
    # delete the empty table if the initial create rolls back (no orphan).
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-operations'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref OperationsKmsKey
      # Denial-of-wallet: cap on-demand throughput.
      OnDemandThroughput:
        MaxReadRequestUnits: !Ref MaxReadRequestUnits
        MaxWriteRequestUnits: !Ref MaxWriteRequestUnits
      DeletionProtectionEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-observation
        - Key: CostCenter
          Value: game-operations
        - Key: ManagedBy
          Value: cloudformation

  # --------------------------------------------------------------------------- #
  # Log groups: Lambda logs + HTTP API access logs, with retention.
  # --------------------------------------------------------------------------- #
  ObservationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: OperationsEnabled
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-operations-observe'
      RetentionInDays: !If [IsProd, 90, 14]
      KmsKeyId: !GetAtt OperationsKmsKey.Arn

  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: OperationsEnabled
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${ProjectName}-operations-access'
      RetentionInDays: !If [IsProd, 90, 14]
      KmsKeyId: !GetAtt OperationsKmsKey.Arn

  # Grant the CloudWatch Logs vended-log delivery principal permission to write
  # HTTP API access logs into the access log group. Without this resource policy
  # the API's access-log delivery fails. Scoped to this account and this API.
  AccessLogDeliveryResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Condition: OperationsEnabled
    DependsOn: AccessLogGroup
    Properties:
      PolicyName: !Sub '${ProjectName}-operations-access-log-delivery'
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "ApiGatewayAccessLogDelivery",
              "Effect": "Allow",
              "Principal": { "Service": "delivery.logs.amazonaws.com" },
              "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
              "Resource": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${ProjectName}-operations-access:*",
              "Condition": {
                "StringEquals": { "aws:SourceAccount": "${AWS::AccountId}" },
                "ArnLike": { "aws:SourceArn": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApi}" }
              }
            }
          ]
        }

  # --------------------------------------------------------------------------- #
  # IAM: dedicated, least-privilege observation execution role.
  # Exactly three GameLift reads; DynamoDB limited to the reads and single
  # transactional write core uses; KMS decrypt + envelope generation only;
  # namespace-scoped PutMetricData. No S3, no GameLift writes, no iam:PassRole,
  # no Step Functions, no UpdateItem/DeleteItem/PutItem/Scan, no wildcard action.
  # --------------------------------------------------------------------------- #
  ObservationRole:
    Type: AWS::IAM::Role
    Condition: OperationsEnabled
    Properties:
      RoleName: !Sub '${ProjectName}-operations-observe-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: GameLiftReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GameLiftThreeReads
                Effect: Allow
                Action:
                  - 'gamelift:DescribeFleetUtilization'
                  - 'gamelift:DescribeFleetCapacity'
                  - 'gamelift:DescribeScalingPolicies'
                Resource: '*'
        - PolicyName: OperationsTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TableScopedReadsAndTransactionalWrite
                Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:TransactWriteItems'
                Resource:
                  - !GetAtt OperationsTable.Arn
        - PolicyName: OperationsKmsUse
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EnvelopeEncryptAuditData
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey'
                Resource:
                  - !GetAtt OperationsKmsKey.Arn
        - PolicyName: OperationsLogsAndMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt ObservationFunctionLogGroup.Arn
                  - !Sub '${ObservationFunctionLogGroup.Arn}:*'
              - Sid: PublishScopedMetrics
                Effect: Allow
                Action:
                  - 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': 'GameAgent/Operations'
              - Sid: XRayTraceWrite
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-observation
        - Key: CostCenter
          Value: game-operations
        - Key: ManagedBy
          Value: cloudformation

  # --------------------------------------------------------------------------- #
  # Lambda: request-scoped observation compute. Code is a real packaged artifact
  # loaded from S3 (built and uploaded by the deploy wrapper under a content-hash
  # key); no inline shim is ever the deployed artifact for an enabled route.
  # --------------------------------------------------------------------------- #
  ObservationFunction:
    Type: AWS::Lambda::Function
    Condition: OperationsEnabled
    DependsOn: ObservationFunctionLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-operations-observe'
      Runtime: python3.13
      Architectures:
        - x86_64
      Handler: operations.observe.lambda_entry.handler
      Role: !GetAtt ObservationRole.Arn
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref RequestDeadlineSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      TracingConfig:
        Mode: Active
      Environment:
        Variables:
          GBAW_OPERATIONS_MODE: !Ref OperationsMode
          GBAW_OPERATIONS_TABLE_NAME: !Ref OperationsTable
          GBAW_OPERATIONS_METRIC_NAMESPACE: 'GameAgent/Operations'
          GBAW_OPERATIONS_TENANT_ID: !Ref TenantId
          GBAW_OPERATIONS_WORKSPACE_ID: !Ref WorkspaceId
          GBAW_OPERATIONS_TRUSTED_AUDIENCE: !If
            - HasExplicitTrustedAudience
            - !Ref TrustedAudience
            - !Ref CognitoClientId
          GBAW_OPERATIONS_PER_READ_BUDGET_S: !Ref PerReadBudgetSeconds
          GBAW_OPERATIONS_PERSISTENCE_BUDGET_S: !Ref PersistenceBudgetSeconds
          GBAW_OPERATIONS_CANCELLATION_MARGIN_S: !Ref CancellationMarginSeconds
          GBAW_OPERATIONS_OBSERVATION_TTL_S: !Ref ObservationTtlSeconds
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-observation
        - Key: CostCenter
          Value: game-operations
        - Key: ManagedBy
          Value: cloudformation

  # --------------------------------------------------------------------------- #
  # API Gateway HTTP API with a Cognito/JWT authorizer on every route.
  # --------------------------------------------------------------------------- #
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: OperationsEnabled
    Properties:
      Name: !Sub '${ProjectName}-operations'
      ProtocolType: HTTP
      # Restrictive CORS: no wildcard origin, credentials disabled by omission.
      CorsConfiguration:
        AllowMethods:
          - POST
          - GET
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 300
      Tags:
        Project: !Ref ProjectName
        Component: operations-observation
        CostCenter: game-operations
        ManagedBy: cloudformation

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: OperationsEnabled
    Properties:
      Name: !Sub '${ProjectName}-operations-jwt'
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Issuer: !Ref CognitoIssuer
        Audience:
          - !Ref CognitoClientId

  ObservationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: OperationsEnabled
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ObservationFunction.Arn
      PayloadFormatVersion: '2.0'
      # Bounded below the 30 s ceiling (milliseconds).
      TimeoutInMillis: 29000

  ObserveRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: OperationsEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /operations/observe'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ObservationIntegration}'

  # GET status route: core (#413) implements the operation status read behind
  # this frozen path parameter route (GET /operations/{operationId}).
  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: OperationsEnabled
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /operations/{operationId}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub 'integrations/${ObservationIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: OperationsEnabled
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","authorizerError":"$context.authorizer.error","integrationErrorMessage":"$context.integrationErrorMessage"}
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        DetailedMetricsEnabled: true
      Tags:
        Project: !Ref ProjectName
        Component: operations-observation
        ManagedBy: cloudformation

  ObservationInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: OperationsEnabled
    Properties:
      FunctionName: !Ref ObservationFunction
      Action: 'lambda:InvokeFunction'
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # --------------------------------------------------------------------------- #
  # CloudWatch alarms on the four frozen metrics.
  # --------------------------------------------------------------------------- #
  ObservationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: OperationsEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-failures'
      AlarmDescription: Observation requests are failing.
      Namespace: 'GameAgent/Operations'
      MetricName: ObservationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ObservationTimeoutsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: OperationsEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-timeouts'
      AlarmDescription: Observation requests are exceeding their deadline.
      Namespace: 'GameAgent/Operations'
      MetricName: ObservationTimeouts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  StuckOperationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: OperationsEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-stuck'
      AlarmDescription: Stuck or lease-expired operations detected.
      Namespace: 'GameAgent/Operations'
      MetricName: StuckOperations
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ObservationLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: OperationsEnabled
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-latency'
      AlarmDescription: Observation request latency approaching the request deadline.
      Namespace: 'GameAgent/Operations'
      MetricName: ObservationRequestLatency
      # p99 is a percentile and must be an ExtendedStatistic, not Statistic.
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      # 27,000 ms acceptance ceiling from ADR 0005 (ceiling - margin).
      Threshold: 27000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  OperationsMode:
    Description: Effective operations mode for this stack deployment.
    Value: !Ref OperationsMode

  HttpApiEndpoint:
    Condition: OperationsEnabled
    Description: Base URL of the authenticated operations HTTP API.
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${ProjectName}-OperationsHttpApiEndpoint'

  OperationsTableName:
    Condition: OperationsEnabled
    Description: DynamoDB table for operation state, idempotency, and the ledger.
    Value: !Ref OperationsTable
    Export:
      Name: !Sub '${ProjectName}-OperationsTableName'

  ObservationRoleArn:
    Condition: OperationsEnabled
    Description: Dedicated least-privilege observation execution role ARN.
    Value: !GetAtt ObservationRole.Arn
    Export:
      Name: !Sub '${ProjectName}-OperationsObservationRoleArn'

  OperationsMetricNamespace:
    Condition: OperationsEnabled
    Description: CloudWatch namespace for E1 metrics.
    Value: 'GameAgent/Operations'
