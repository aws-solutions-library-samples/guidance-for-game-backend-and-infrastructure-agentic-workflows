AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Optional, default-unprovisioned E5 bounded-autonomy evaluator. It uses a
  separate disabled-by-default AppConfig switch and starts the existing E3
  Standard workflow with only an operation ID. The existing E3 executor remains
  the sole provider writer. Disabling E5 stops scheduled evaluation and fails
  closed without deleting data.

# --------------------------------------------------------------------------- #
# Parameters
# --------------------------------------------------------------------------- #
Parameters:
  ProjectName:
    Type: String
    Default: game-agent
    Description: Project name used for resource naming.

  Provisioned:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'
    Description: >-
      Initial-provisioning authority, SEPARATE from the runtime AutonomyMode
      switch. "false" (the default) creates ZERO E5 resources, so a default new
      stack costs $0 and holds nothing. "true" provisions the full E5 resource
      set (evaluator Lambda/role, DLQ, log group, separate AppConfig autonomy
      application/environment/profile + default-disabled document, EventBridge
      evaluation rule, alarms). Once "true" it MUST stay "true" for the life of
      the stack: an emergency disable flips AutonomyMode to "disabled" but keeps
      Provisioned="true" so every resource stays under CloudFormation with stable
      names and a later re-enable is reversible. Setting it back to "false"
      REMOVES the resources and is a teardown decision, not a disable.

  AutonomyMode:
    Type: String
    Default: disabled
    AllowedValues:
      - disabled
      - operate
    Description: >-
      Runtime authority (kill switch) for a PROVISIONED autonomy plane, SEPARATE
      from the Provisioned flag. "disabled" (the default) is fail-closed on TWO
      independent levers: (1) the EventBridge evaluation rule is DISABLED so no
      evaluation is scheduled, and (2) GBAW_OPERATIONS_AUTONOMY_ENABLED=false is
      injected into the evaluator so an already-running invocation fails closed
      at startup before any durable state advance or dispatch. "operate" is the
      only enabled mode. An emergency disable sets this to "disabled" while
      leaving Provisioned="true" (resources and data retained, reversible); it
      does NOT delete resources or data.

  Environment:
    Type: String
    Default: beta
    AllowedValues:
      - beta
      - prod
    Description: >-
      Target environment. "prod" lengthens the log-retention posture for audit
      data and names the AppConfig environment. E5 keeps no data of its own; it
      advances durable accounting state on the reused 06 table.

  OperationsTableName:
    Type: String
    Default: ''
    Description: >-
      Name of the E1/E2 operations DynamoDB table (cross-stack reuse; the 06
      stack exports it). E5 does not create a table; it persists the immutable
      evidence bundle and reserves the rolling window state on this same table.
      Required when Provisioned=true.

  OperationsKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:\d{12}:key/.+$'
    Description: >-
      ARN of the E1/E2 operations customer-managed KMS key that encrypts the
      operations table. The evaluator uses it STRICTLY on DynamoDB's behalf
      (kms:ViaService pinned to DynamoDB). Required when Provisioned=true.

  ExecutionStateMachineArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:states:[a-z0-9-]+:\d{12}:stateMachine:.+$'
    Description: >-
      ARN of the EXISTING E3 (07) Standard execution state machine. The evaluator
      starts THIS exact state machine (states:StartExecution) with an
      operation_id ALONE; it never creates its own state machine and never
      invokes the executor directly. Required when AutonomyMode=operate.

  AppConfigExtensionLayerArn:
    Type: String
    Default: ''
    Description: >-
      Official AWS AppConfig Agent Lambda extension layer ARN (resolved to the
      authoritative regional version by the reviewed E5 wrapper). Empty = no
      extension attached. Required when AutonomyMode=operate.

  AutonomyPolicyId:
    Type: String
    Default: ''
    Description: >-
      The server-owned autonomy policy id the evaluator binds exactly (#438
      contract). Never taken from the event or a model. Required when
      AutonomyMode=operate.

  AutonomyPolicyVersion:
    Type: String
    Default: ''
    Description: The exact autonomy policy version. Required when AutonomyMode=operate.

  AutonomyPolicyHash:
    Type: String
    Default: ''
    Description: >-
      The exact autonomy policy hash the evaluator re-validates the stored policy
      against (fail closed on mismatch). Required when AutonomyMode=operate.

  AutonomyStateId:
    Type: String
    Default: ''
    Description: >-
      The durable rolling window-state id the evaluator reserves budget/frequency/
      concurrency against. Required when AutonomyMode=operate.

  AutonomySubject:
    Type: String
    Default: ''
    Description: >-
      The trusted automation subject the runtime binds server-side (never from
      the event). Required when AutonomyMode=operate.

  AutonomyClient:
    Type: String
    Default: ''
    Description: >-
      The trusted automation client the runtime binds server-side (never from the
      event). Required when AutonomyMode=operate.

  TenantId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    Description: >-
      Server-side trusted tenant the runtime binds (GBAW_OPERATIONS_TENANT_ID).
      Must match the 06/07 stacks. Required when AutonomyMode=operate.

  WorkspaceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    Description: >-
      Server-side trusted workspace the runtime binds (GBAW_OPERATIONS_WORKSPACE_ID).
      Must match the 06/07 stacks. Required when AutonomyMode=operate.

  TrustedAudience:
    Type: String
    Default: ''
    Description: >-
      Server-side trusted audience (GBAW_OPERATIONS_TRUSTED_AUDIENCE). Must match
      the 06/07 stacks. Required when AutonomyMode=operate.

  KillSwitchApplicationId:
    Type: String
    Default: ''
    Description: >-
      The EXISTING E4 (08) kill-switch AppConfig application id (08 exports
      OperationsControlApplicationId). The evaluator reads the E4 kill switch
      from THIS application, which is SEPARATE from the E5 autonomy application
      this stack creates. Required when AutonomyMode=operate.

  KillSwitchEnvironmentId:
    Type: String
    Default: ''
    Description: >-
      The EXISTING E4 (08) kill-switch AppConfig environment id (08 exports
      OperationsControlEnvironmentId). Required when AutonomyMode=operate.

  KillSwitchProfileId:
    Type: String
    Default: ''
    Description: >-
      The EXISTING E4 (08) kill-switch AppConfig configuration profile id (08
      exports OperationsKillSwitchProfileId). The evaluator composes the SAME E4
      kill switch the executor reads; it is never the autonomy switch. Required
      when AutonomyMode=operate.

  EnrolledFleetId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^fleet-[a-f0-9-]{1,120}$'
    Description: >-
      The EXACT enrolled demo/test GameLift fleet id the autonomy plane operates
      within (0/1/1 clamp). Bound server-side; never from the event. Required
      when AutonomyMode=operate. Note: the evaluator holds NO gamelift permission;
      this is threaded only so the durable pre-verification binds the fleet.

  EnrolledFleetArn:
    Type: String
    Default: ''
    Description: >-
      The EXACT enrolled fleet ARN. Bound server-side. Required when
      AutonomyMode=operate.

  EnrolledLocation:
    Type: String
    Default: us-west-2
    AllowedPattern: '^[a-z]{2}-[a-z]+-\d$'
    Description: >-
      The EXACT enrolled fleet home Region / location. Bound server-side; never
      from the event.

  CapabilityMaximum:
    Type: String
    Default: operate
    AllowedValues:
      - operate
    Description: >-
      The executor capability maximum the evaluator settings require (EXACTLY
      "operate"). Fixed here because bounded autonomy requires operate authority;
      a lower ceiling can never admit an autonomous write and would refuse at
      startup.

  CodeS3Bucket:
    Type: String
    Default: ''
    Description: >-
      Explicit, pre-existing S3 bucket holding the packaged evaluator Lambda
      artifact (supplied by the reviewed wrapper). Required when Provisioned=true.

  EvaluatorCodeS3Key:
    Type: String
    Default: ''
    Description: >-
      Content-hash-addressed S3 key of the packaged evaluator artifact. Required
      when Provisioned=true.

  LambdaMemoryMb:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 1024
    Description: Memory for the evaluator Lambda.

  EvaluatorTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 120
    Description: Evaluator Lambda timeout (bounded).

  ReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5
    Description: >-
      Reserved concurrency cap on the evaluator (denial-of-wallet guard). A cap
      of 1 also bounds concurrent evaluation to a single in-flight run.

  AppConfigExtensionPort:
    Type: Number
    Default: 2772
    MinValue: 1
    MaxValue: 65535
    Description: Localhost port the official AppConfig extension listens on.

  # ------------------------------------------------------------------------- #
  # Server-owned CLOSED evaluation event (#439). The scheduled rule injects
  # EXACTLY {observation_operation_id, desired, minimum, maximum} — never a
  # synthetic payload. When any is left at its empty/sentinel default the rule
  # stays DISABLED, so an operate deploy that has not specified a concrete closed
  # event schedules nothing (no malformed event is ever delivered).
  # ------------------------------------------------------------------------- #
  ScheduledObservationOperationId:
    Type: String
    Default: ''
    Description: >-
      The EXACT server-owned observation operation id the scheduled evaluation
      binds. Empty (default) keeps the schedule DISABLED.

  ScheduledDesired:
    Type: Number
    Default: -1
    Description: >-
      The exact desired capacity of the closed evaluation event. -1 (default) is
      the "unset" sentinel that keeps the schedule DISABLED.

  ScheduledMinimum:
    Type: Number
    Default: -1
    Description: >-
      The exact minimum capacity of the closed evaluation event. -1 keeps the
      schedule DISABLED.

  ScheduledMaximum:
    Type: Number
    Default: -1
    Description: >-
      The exact maximum capacity of the closed evaluation event. -1 keeps the
      schedule DISABLED.

# --------------------------------------------------------------------------- #
# Conditions
# --------------------------------------------------------------------------- #
Conditions:
  # Resource existence gate. Every resource references THIS, driven by the
  # Provisioned flag (default "false"), so a default deploy provisions nothing
  # and costs $0. DECOUPLED from AutonomyMode: an emergency disable sets
  # AutonomyMode=disabled but keeps Provisioned="true", so resources stay under
  # CloudFormation and a later re-enable is reversible.
  ResourcesProvisioned: !Equals [!Ref Provisioned, 'true']

  # Runtime authority (kill switch). Does NOT gate resource existence; it drives
  # the EventBridge rule state (lever 1) and the injected
  # GBAW_OPERATIONS_AUTONOMY_ENABLED flag (lever 2). Only "operate" is enabled.
  AutonomyOperate: !Equals [!Ref AutonomyMode, operate]

  IsProd: !Equals [!Ref Environment, prod]

  # The scheduled closed event is fully specified: a non-empty observation id and
  # all three capacity values set away from the -1 "unset" sentinel.
  ScheduledEventConfigured: !And
    - !Not [!Equals [!Ref ScheduledObservationOperationId, '']]
    - !Not [!Equals [!Ref ScheduledDesired, -1]]
    - !Not [!Equals [!Ref ScheduledMinimum, -1]]
    - !Not [!Equals [!Ref ScheduledMaximum, -1]]

  # The scheduled evaluation rule is ENABLED only when autonomy is operate AND a
  # concrete closed #439 event is fully specified; otherwise it stays DISABLED so
  # no malformed or synthetic event is ever delivered.
  ScheduledEvaluationEnabled: !And
    - !Condition AutonomyOperate
    - !Condition ScheduledEventConfigured

Rules:
  # Reject "operate without provisioning": runtime authority can only be enabled
  # when the resources it needs actually exist.
  OperateRequiresProvisioning:
    RuleCondition: !Not [!Equals [!Ref AutonomyMode, disabled]]
    Assertions:
      - Assert: !Equals [!Ref Provisioned, 'true']
        AssertDescription: >-
          AutonomyMode=operate requires Provisioned=true; enabling autonomy
          authority against a zero-resource stack is rejected.

  # Whenever resources exist, the cross-stack data-plane bindings and the code
  # artifacts they reference must be non-empty.
  ProvisionedRequiresInputs:
    RuleCondition: !Equals [!Ref Provisioned, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref OperationsTableName, '']]
        AssertDescription: OperationsTableName is required when Provisioned=true.
      - Assert: !Not [!Equals [!Ref OperationsKmsKeyArn, '']]
        AssertDescription: OperationsKmsKeyArn is required when Provisioned=true.
      - Assert: !Not [!Equals [!Ref CodeS3Bucket, '']]
        AssertDescription: CodeS3Bucket is required when Provisioned=true.
      - Assert: !Not [!Equals [!Ref EvaluatorCodeS3Key, '']]
        AssertDescription: EvaluatorCodeS3Key is required when Provisioned=true.

  # Enabling operate requires the exact state machine, the extension layer, the
  # policy binding, the durable state id, the trusted subject/client, and the
  # enrolled fleet bindings.
  OperateRequiresBindings:
    RuleCondition: !Equals [!Ref AutonomyMode, operate]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExecutionStateMachineArn, '']]
        AssertDescription: ExecutionStateMachineArn is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AppConfigExtensionLayerArn, '']]
        AssertDescription: AppConfigExtensionLayerArn is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomyPolicyId, '']]
        AssertDescription: AutonomyPolicyId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomyPolicyVersion, '']]
        AssertDescription: AutonomyPolicyVersion is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomyPolicyHash, '']]
        AssertDescription: AutonomyPolicyHash is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomyStateId, '']]
        AssertDescription: AutonomyStateId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomySubject, '']]
        AssertDescription: AutonomySubject is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref AutonomyClient, '']]
        AssertDescription: AutonomyClient is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref TenantId, '']]
        AssertDescription: TenantId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref WorkspaceId, '']]
        AssertDescription: WorkspaceId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref EnrolledFleetId, '']]
        AssertDescription: EnrolledFleetId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref EnrolledFleetArn, '']]
        AssertDescription: EnrolledFleetArn is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref KillSwitchApplicationId, '']]
        AssertDescription: KillSwitchApplicationId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref KillSwitchEnvironmentId, '']]
        AssertDescription: KillSwitchEnvironmentId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref KillSwitchProfileId, '']]
        AssertDescription: KillSwitchProfileId is required when AutonomyMode=operate.
      - Assert: !Not [!Equals [!Ref TrustedAudience, '']]
        AssertDescription: TrustedAudience is required when AutonomyMode=operate (must match 06/07).

# --------------------------------------------------------------------------- #
# Resources
# --------------------------------------------------------------------------- #
Resources:
  # ------------------------------------------------------------------------- #
  # Log group + DLQ. The evaluator log group uses default (CloudWatch
  # service-managed) at-rest encryption. It is deliberately NOT encrypted with
  # the reused 06 operations CMK: that key's policy pins usage to DynamoDB
  # (kms:ViaService dynamodb.*) and does not grant CloudWatch Logs
  # (logs.<region>.amazonaws.com) the kms:Encrypt*/Decrypt/GenerateDataKey*/
  # DescribeKey it needs to encrypt this log group, so a CMK-encrypted log group
  # would fail to create. Re-introducing a CMK here requires SAFELY extending the
  # 06 key policy (owned by another stack) to authorize the Logs service for this
  # exact log-group ARN. Both resources are RetainExceptOnCreate so audit data is
  # preserved on teardown/replacement but a rolled-back initial create leaves no
  # orphan.
  # ------------------------------------------------------------------------- #
  EvaluatorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ResourcesProvisioned
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-operations-autonomy-evaluator'
      RetentionInDays: !If [IsProd, 90, 14]

  EvaluatorDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: ResourcesProvisioned
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ProjectName}-operations-autonomy-evaluator-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-autonomy
        - Key: ManagedBy
          Value: cloudformation

  # ------------------------------------------------------------------------- #
  # Separate AppConfig AUTONOMY switch. This is a DISTINCT application/environment/
  # profile from the E4 (08) kill switch: enabling E4 never enables autonomy.
  # The seeded default document is DISABLED on every axis and already expired so
  # it fails closed until the reviewed control plane issues a fresh document. It
  # is validated BOTH by AppConfig against a strict JSON_SCHEMA validator on the
  # profile AND in-code by operations.autonomy_switch, and it is DEPLOYED through
  # the immediate strategy so a live read always finds a fail-closed document.
  # E4's frozen kill-switch schema is never touched.
  # ------------------------------------------------------------------------- #
  AutonomyApplication:
    Type: AWS::AppConfig::Application
    Condition: ResourcesProvisioned
    Properties:
      Name: !Sub '${ProjectName}-operations-autonomy'
      Description: Separate AppConfig application for the bounded-autonomy switch.

  AutonomyEnvironment:
    Type: AWS::AppConfig::Environment
    Condition: ResourcesProvisioned
    Properties:
      ApplicationId: !Ref AutonomyApplication
      Name: !Ref Environment
      Description: !Sub 'Operations autonomy environment (${Environment}).'
      Monitors:
        # The rollback monitor watches an AWS-EMITTED metric (the evaluator
        # Lambda's AWS/Lambda Errors), so a freshly-deployed autonomy-switch
        # document that makes the evaluator fail is rolled back automatically
        # during the bake. A custom GameAgent/Operations metric is NOT emitted by
        # a default/disabled plane and cannot drive rollback.
        - AlarmArn: !GetAtt AutonomyEvaluatorErrorsAlarm.Arn
          AlarmRoleArn: !GetAtt AppConfigMonitorRole.Arn

  AutonomySwitchProfile:
    Type: AWS::AppConfig::ConfigurationProfile
    Condition: ResourcesProvisioned
    Properties:
      ApplicationId: !Ref AutonomyApplication
      Name: !Sub '${ProjectName}-operations-autonomy-switch'
      LocationUri: hosted
      Description: >-
        The separate bounded-autonomy switch document, DISABLED by default,
        validated by AppConfig against a strict JSON schema AND re-validated in
        code (operations.autonomy_switch). Independent of the E4 kill switch.
      Validators:
        # A self-contained JSON Schema mirroring operations.autonomy_switch's
        # strict in-code contract: a closed object with exactly the autonomy
        # switch fields, a fixed document version, a non-negative integer
        # config_version, UTC-Z date-time freshness bounds, a boolean primary
        # flag, and a non-empty capabilities map whose entries are closed
        # {"autonomous_write": bool} objects. No external/urn $ref, so AppConfig
        # validates it with no reference resolution. This is SEPARATE from — and
        # never mutates — E4's frozen kill-switch schema.
        - Type: JSON_SCHEMA
          Content: |
            {
              "$schema": "https://json-schema.org/draft/2020-12/schema",
              "$id": "urn:game-agent:operations:autonomy:v1:autonomy-switch",
              "title": "Operations Autonomy Switch AppConfig Document 1.0",
              "type": "object",
              "additionalProperties": false,
              "required": [
                "autonomy_switch_version",
                "config_version",
                "issued_at",
                "not_after",
                "autonomy_enabled",
                "capabilities"
              ],
              "properties": {
                "autonomy_switch_version": { "type": "string", "const": "1.0" },
                "config_version": { "type": "integer", "minimum": 0 },
                "issued_at": {
                  "type": "string",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
                },
                "not_after": {
                  "type": "string",
                  "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
                },
                "autonomy_enabled": { "type": "boolean" },
                "capabilities": {
                  "type": "object",
                  "minProperties": 1,
                  "additionalProperties": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["autonomous_write"],
                    "properties": {
                      "autonomous_write": { "type": "boolean" }
                    }
                  }
                }
              }
            }

  DefaultDisabledAutonomyVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Condition: ResourcesProvisioned
    Properties:
      ApplicationId: !Ref AutonomyApplication
      ConfigurationProfileId: !Ref AutonomySwitchProfile
      ContentType: application/json
      Description: Safe default autonomy switch document (disabled, fail-closed).
      # autonomy_enabled=false and autonomous_write=false on the one capability;
      # already-expired freshness window so a live read never treats it as fresh
      # until the reviewed control plane issues a fresh, explicitly-enabled doc.
      Content: |
        {
          "autonomy_switch_version": "1.0",
          "config_version": 1,
          "issued_at": "1970-01-01T00:00:00Z",
          "not_after": "1970-01-01T00:05:00Z",
          "autonomy_enabled": false,
          "capabilities": {
            "gamelift.capacity-adjustment": {
              "autonomous_write": false
            }
          }
        }

  AutonomyGradualDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Condition: ResourcesProvisioned
    Properties:
      Name: !Sub '${ProjectName}-operations-autonomy-gradual'
      Description: Gradual autonomy switch rollout with bake time and monitor rollback.
      DeploymentDurationInMinutes: 5
      FinalBakeTimeInMinutes: 5
      GrowthFactor: 25
      GrowthType: LINEAR
      ReplicateTo: NONE

  AutonomyImmediateDeploymentStrategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Condition: ResourcesProvisioned
    Properties:
      Name: !Sub '${ProjectName}-operations-autonomy-immediate'
      Description: Emergency immediate (hard-down) autonomy switch rollout, no bake time.
      DeploymentDurationInMinutes: 0
      FinalBakeTimeInMinutes: 0
      GrowthFactor: 100
      GrowthType: LINEAR
      ReplicateTo: NONE

  # Deploy the SAFE default (disabled, already-expired) hosted version through
  # the immediate strategy so a live read finds a deployed, fail-closed document
  # from the moment the plane is provisioned. Without this deployment AppConfig
  # would serve no configuration and every read would fail to find one. The
  # reviewed control plane later deploys a fresh, explicitly-enabled version
  # (gradually, with monitor rollback) to actually enable autonomy.
  DefaultDisabledAutonomyDeployment:
    Type: AWS::AppConfig::Deployment
    Condition: ResourcesProvisioned
    Properties:
      ApplicationId: !Ref AutonomyApplication
      EnvironmentId: !Ref AutonomyEnvironment
      ConfigurationProfileId: !Ref AutonomySwitchProfile
      ConfigurationVersion: !Ref DefaultDisabledAutonomyVersion
      DeploymentStrategyId: !Ref AutonomyImmediateDeploymentStrategy
      Description: Deploy the safe default (disabled, fail-closed) autonomy switch document.

  # AppConfig monitor role: lets AppConfig read the CloudWatch alarm state during
  # a gradual deployment bake so a breach rolls the deployment back automatically.
  AppConfigMonitorRole:
    Type: AWS::IAM::Role
    Condition: ResourcesProvisioned
    Properties:
      RoleName: !Sub '${ProjectName}-operations-autonomy-monitor-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appconfig.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: ReadAutonomyAlarm
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeAutonomyAlarm
                Effect: Allow
                Action:
                  - 'cloudwatch:DescribeAlarms'
                Resource: '*'

  # ------------------------------------------------------------------------- #
  # Evaluator role: least privilege. It advances DURABLE accounting state and
  # starts the EXISTING E3 Standard workflow with an identifier. It holds NO
  # gamelift permission, NO lambda:InvokeFunction, NO iam:PassRole, and no
  # wildcard write. Exactly: the operations table (bounded single-item actions),
  # the CMK strictly via DynamoDB, the exact AppConfig autonomy data plane read,
  # the exact E3 state machine StartExecution, and its own logs/metrics/X-Ray/DLQ.
  # ------------------------------------------------------------------------- #
  EvaluatorRole:
    Type: AWS::IAM::Role
    Condition: ResourcesProvisioned
    Properties:
      RoleName: !Sub '${ProjectName}-operations-autonomy-evaluator-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: OperationsTableAccess
          # Persist the immutable evidence bundle (conditional PutItem), reserve
          # the rolling window state (UpdateItem), and read policy/observation/
          # window state (GetItem/Query). The TransactWriteItems API authorizes on
          # these underlying single-item actions; the invalid
          # dynamodb:TransactWriteItems IAM action is never present. Scan,
          # DeleteItem, and Batch* stay denied by omission.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: TableScopedItemActions
                Effect: Allow
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:UpdateItem'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OperationsTableName}'
        - PolicyName: OperationsKmsViaDynamoDb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDbCmkDataPlane
                Effect: Allow
                Action:
                  - 'kms:Encrypt'
                  - 'kms:Decrypt'
                  - 'kms:ReEncrypt*'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                Resource:
                  - !Ref OperationsKmsKeyArn
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
              - Sid: DynamoDbCmkCreateGrant
                Effect: Allow
                Action:
                  - 'kms:CreateGrant'
                Resource:
                  - !Ref OperationsKmsKeyArn
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
                  Bool:
                    'kms:GrantIsForAWSResource': 'true'
        - PolicyName: AutonomyAppConfigRead
          # EXACTLY the two AppConfig data-plane read actions, scoped to the two
          # exact configuration coordinates the evaluator composes: (1) the
          # SEPARATE autonomy switch this stack creates, and (2) the EXISTING E4
          # kill switch in the 08 control-plane application. No authoring/admin
          # action, no wildcard, no other configuration.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAutonomySwitchConfigurationOnly
                Effect: Allow
                Action:
                  - 'appconfig:StartConfigurationSession'
                  - 'appconfig:GetLatestConfiguration'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${AutonomyApplication}/environment/${AutonomyEnvironment}/configuration/${AutonomySwitchProfile}'
              - Sid: ReadE4KillSwitchConfigurationOnly
                Effect: Allow
                Action:
                  - 'appconfig:StartConfigurationSession'
                  - 'appconfig:GetLatestConfiguration'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:appconfig:${AWS::Region}:${AWS::AccountId}:application/${KillSwitchApplicationId}/environment/${KillSwitchEnvironmentId}/configuration/${KillSwitchProfileId}'
        - PolicyName: StartExactExecutionStateMachine
          # Start ONLY the exact existing E3 Standard state machine. This is the
          # sole cross-component authority: the evaluator hands the workflow an
          # operation_id and the workflow (not the evaluator) invokes the single
          # executor. No states:* wildcard, no other state machine.
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StartExecutionOnExactStateMachine
                Effect: Allow
                Action:
                  - 'states:StartExecution'
                Resource:
                  - !Ref ExecutionStateMachineArn
        - PolicyName: EvaluatorLogsMetricsAndDlq
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt EvaluatorLogGroup.Arn
                  - !Sub '${EvaluatorLogGroup.Arn}:*'
              - Sid: XRayTraceWrite
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                Resource: '*'
              - Sid: SendToOwnDeadLetterQueue
                Effect: Allow
                Action:
                  - 'sqs:SendMessage'
                Resource:
                  - !GetAtt EvaluatorDeadLetterQueue.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-autonomy
        - Key: ManagedBy
          Value: cloudformation

  # ------------------------------------------------------------------------- #
  # Evaluator Lambda: the deployable #439 runtime bootstrap. It constructs (from
  # env only) DynamoDB/AppConfig/StepFunctions clients — NEVER a CloudWatch,
  # GameLift client and NEVER a Lambda-invoke client. The disable levers are the
  # DISABLED EventBridge source and the injected AUTONOMY_ENABLED=false flag.
  # ------------------------------------------------------------------------- #
  EvaluatorFunction:
    Type: AWS::Lambda::Function
    Condition: ResourcesProvisioned
    DependsOn: EvaluatorLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-operations-autonomy-evaluator'
      Runtime: python3.13
      Architectures:
        - x86_64
      Handler: operations.autonomy_runtime.evaluator_entry.handler
      Role: !GetAtt EvaluatorRole.Arn
      MemorySize: !Ref LambdaMemoryMb
      Timeout: !Ref EvaluatorTimeoutSeconds
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      TracingConfig:
        Mode: Active
      DeadLetterConfig:
        TargetArn: !GetAtt EvaluatorDeadLetterQueue.Arn
      Environment:
        Variables:
          # Lever 2: the autonomy enable flag. false (default) makes the evaluator
          # fail closed at startup (resolve_autonomy_evaluator_settings refuses)
          # BEFORE any durable state advance or dispatch — WITHOUT deleting the
          # function. Only AutonomyMode=operate injects 'true'.
          GBAW_OPERATIONS_AUTONOMY_ENABLED: !If [AutonomyOperate, 'true', 'false']
          # Bounded autonomy requires the static mode to be EXACTLY 'operate' and
          # the executor capability maximum to be EXACTLY 'operate'; the settings
          # resolver refuses otherwise. The AUTONOMY_ENABLED flag + disabled event
          # source are the disable levers, not this ceiling.
          GBAW_OPERATIONS_MODE: operate
          GBAW_OPERATIONS_CAPABILITY_MAXIMUM: !Ref CapabilityMaximum
          GBAW_OPERATIONS_TABLE_NAME: !Ref OperationsTableName
          GBAW_OPERATIONS_METRIC_NAMESPACE: 'GameAgent/Operations'
          GBAW_OPERATIONS_TENANT_ID: !Ref TenantId
          GBAW_OPERATIONS_WORKSPACE_ID: !Ref WorkspaceId
          GBAW_OPERATIONS_TRUSTED_AUDIENCE: !Ref TrustedAudience
          # The E3 executor deployment settings the resolver also validates.
          GBAW_OPERATIONS_STATE_MACHINE_ARN: !Ref ExecutionStateMachineArn
          GBAW_OPERATIONS_ENROLLED_FLEET_ID: !Ref EnrolledFleetId
          GBAW_OPERATIONS_ENROLLED_FLEET_ARN: !Ref EnrolledFleetArn
          GBAW_OPERATIONS_ENROLLED_LOCATION: !Ref EnrolledLocation
          # Autonomy-specific identifiers (issue #439/#440 evaluator contract).
          GBAW_OPERATIONS_AUTONOMY_STATE_MACHINE_ARN: !Ref ExecutionStateMachineArn
          GBAW_OPERATIONS_AUTONOMY_SWITCH_PROFILE: !Ref AutonomySwitchProfile
          GBAW_OPERATIONS_AUTONOMY_POLICY_ID: !Ref AutonomyPolicyId
          GBAW_OPERATIONS_AUTONOMY_POLICY_VERSION: !Ref AutonomyPolicyVersion
          GBAW_OPERATIONS_AUTONOMY_POLICY_HASH: !Ref AutonomyPolicyHash
          GBAW_OPERATIONS_AUTONOMY_STATE_ID: !Ref AutonomyStateId
          GBAW_OPERATIONS_AUTONOMY_SUBJECT: !Ref AutonomySubject
          GBAW_OPERATIONS_AUTONOMY_CLIENT: !Ref AutonomyClient
          # E4 kill-switch AppConfig coordinate (from the 08 control plane). The
          # evaluator composes the SAME E4 kill switch the executor reads. This is
          # a DIFFERENT application/environment from the autonomy switch below, so
          # enabling E4 never enables autonomy and vice-versa. Scoped reads only.
          GBAW_OPERATIONS_APPCONFIG_APPLICATION: !Ref KillSwitchApplicationId
          GBAW_OPERATIONS_APPCONFIG_ENVIRONMENT: !Ref KillSwitchEnvironmentId
          GBAW_OPERATIONS_APPCONFIG_PROFILE: !Ref KillSwitchProfileId
          # Separate E5 autonomy AppConfig coordinate (created by THIS stack). The
          # autonomy switch document is read from this application/environment.
          GBAW_OPERATIONS_AUTONOMY_APPCONFIG_APPLICATION: !Ref AutonomyApplication
          GBAW_OPERATIONS_AUTONOMY_APPCONFIG_ENVIRONMENT: !Ref AutonomyEnvironment
          GBAW_OPERATIONS_APPCONFIG_EXTENSION_PORT: !Ref AppConfigExtensionPort
      Layers:
        - !If [AutonomyOperate, !Ref AppConfigExtensionLayerArn, !Ref 'AWS::NoValue']
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref EvaluatorCodeS3Key
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Component
          Value: operations-autonomy
        - Key: ManagedBy
          Value: cloudformation

  # ------------------------------------------------------------------------- #
  # EventBridge evaluation rule. DISABLED unless AutonomyMode=operate (lever 1),
  # so a default (or emergency-disabled) deploy schedules NO evaluation. When
  # enabled it periodically invokes the evaluator with a closed, source-owned
  # event; identity/policy/limits are NEVER read from the event.
  # ------------------------------------------------------------------------- #
  EvaluationRule:
    Type: AWS::Events::Rule
    Condition: ResourcesProvisioned
    Properties:
      Name: !Sub '${ProjectName}-operations-autonomy-evaluation'
      Description: >-
        Periodic bounded-autonomy evaluation trigger. DISABLED unless
        AutonomyMode=operate so a default/disabled deploy runs no evaluation.
      ScheduleExpression: 'rate(5 minutes)'
      State: !If [ScheduledEvaluationEnabled, ENABLED, DISABLED]
      Targets:
        - Id: autonomy-evaluator
          Arn: !GetAtt EvaluatorFunction.Arn
          # The rule carries no identity/policy/limits — the evaluator owns those
          # server-side. It injects EXACTLY the closed #439 evaluation event
          # (observation_operation_id + desired/minimum/maximum) built from the
          # server-owned Scheduled* parameters. The rule is DISABLED unless those
          # parameters are all set (ScheduledEvaluationEnabled), so a synthetic or
          # partial event is never delivered.
          Input: !Sub
            - '{"observation_operation_id":"${OpId}","desired":${Desired},"minimum":${Minimum},"maximum":${Maximum}}'
            - OpId: !Ref ScheduledObservationOperationId
              Desired: !Ref ScheduledDesired
              Minimum: !Ref ScheduledMinimum
              Maximum: !Ref ScheduledMaximum
          DeadLetterConfig:
            Arn: !GetAtt EvaluatorDeadLetterQueue.Arn

  EvaluationInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: ResourcesProvisioned
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref EvaluatorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EvaluationRule.Arn

  # ------------------------------------------------------------------------- #
  # Alarms, each driven by an AWS-EMITTED metric (AWS/Lambda Errors + Throttles,
  # AWS/Events FailedInvocations, AWS/SQS DLQ depth). The evaluator emits NO
  # custom metrics, so no alarm depends on backend instrumentation that a
  # default/disabled plane would never emit. TreatMissingData=notBreaching keeps
  # them quiet until autonomy actually runs.
  # ------------------------------------------------------------------------- #
  # The AppConfig environment ROLLBACK monitor metric: the evaluator Lambda's
  # AWS-emitted AWS/Lambda Errors. This is emitted by the platform whenever the
  # evaluator errors (e.g. a freshly-deployed switch document it cannot read as
  # fresh/valid makes it fail closed and raise), so a bad autonomy-switch
  # deployment rolls back during its bake without depending on custom
  # instrumentation that a default/disabled plane never emits.
  AutonomyEvaluatorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ResourcesProvisioned
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-AutonomyEvaluatorErrors'
      AlarmDescription: >-
        The autonomy evaluator Lambda emitted AWS/Lambda Errors. Drives the
        AppConfig autonomy-switch deployment rollback monitor during the bake.
      Namespace: 'AWS/Lambda'
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          # Deterministic function name (matches EvaluatorFunction's
          # FunctionName property) so the alarm does not take a resource
          # dependency on EvaluatorFunction. That edge would otherwise close
          # the cycle AutonomyEnvironment(monitor)->this alarm->EvaluatorFunction
          # ->AutonomyEnvironment(env var) that cfn-lint rejects as E3004.
          Value: !Sub '${ProjectName}-operations-autonomy-evaluator'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Denial-of-wallet / concurrency-exhaustion signal on the evaluator, using the
  # AWS-emitted AWS/Lambda Throttles metric (the reserved-concurrency cap of 1
  # means a stuck or piled-up evaluation throttles rather than fans out).
  AutonomyEvaluatorThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ResourcesProvisioned
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-AutonomyEvaluatorThrottles'
      AlarmDescription: >-
        The autonomy evaluator Lambda was throttled (reserved-concurrency cap or
        denial-of-wallet guard). AWS-emitted metric.
      Namespace: 'AWS/Lambda'
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          # Deterministic function name (matches EvaluatorFunction's
          # FunctionName property) so the alarm does not take a resource
          # dependency on EvaluatorFunction. That edge would otherwise close
          # the cycle AutonomyEnvironment(monitor)->this alarm->EvaluatorFunction
          # ->AutonomyEnvironment(env var) that cfn-lint rejects as E3004.
          Value: !Sub '${ProjectName}-operations-autonomy-evaluator'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # A scheduled evaluation that EventBridge could not deliver to the evaluator,
  # using the AWS-emitted AWS/Events FailedInvocations metric on the rule (the
  # rule also has a DLQ; this alarms on delivery failure regardless).
  AutonomyEvaluationDeliveryFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ResourcesProvisioned
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-AutonomyEvaluationDeliveryFailures'
      AlarmDescription: >-
        The scheduled autonomy evaluation could not be delivered to the evaluator
        (EventBridge FailedInvocations). AWS-emitted metric.
      Namespace: 'AWS/Events'
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref EvaluationRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # The evaluator Lambda wrote to its dead-letter queue — an unprocessed
  # evaluation event needs human attention.
  AutonomyDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ResourcesProvisioned
    Properties:
      AlarmName: !Sub '${ProjectName}-operations-AutonomyDeadLetter'
      AlarmDescription: The autonomy evaluator sent a message to its dead-letter queue.
      Namespace: 'AWS/SQS'
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EvaluatorDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# --------------------------------------------------------------------------- #
# Outputs
# --------------------------------------------------------------------------- #
Outputs:
  Provisioned:
    Description: Whether this stack provisioned the E5 resource set (false = $0).
    Value: !Ref Provisioned

  AutonomyMode:
    Description: Effective runtime authority (disabled fails closed; operate enabled).
    Value: !Ref AutonomyMode

  AutonomyApplicationId:
    Condition: ResourcesProvisioned
    Description: Separate AppConfig application id for the autonomy switch.
    Value: !Ref AutonomyApplication
    Export:
      Name: !Sub '${ProjectName}-OperationsAutonomyApplicationId'

  AutonomyEnvironmentId:
    Condition: ResourcesProvisioned
    Description: AppConfig environment id for the autonomy switch.
    Value: !Ref AutonomyEnvironment
    Export:
      Name: !Sub '${ProjectName}-OperationsAutonomyEnvironmentId'

  AutonomySwitchProfileId:
    Condition: ResourcesProvisioned
    Description: Separate AppConfig configuration profile id for the autonomy switch.
    Value: !Ref AutonomySwitchProfile
    Export:
      Name: !Sub '${ProjectName}-OperationsAutonomySwitchProfileId'

  EvaluatorFunctionArn:
    Condition: ResourcesProvisioned
    Description: ARN of the autonomy evaluator Lambda.
    Value: !GetAtt EvaluatorFunction.Arn
    Export:
      Name: !Sub '${ProjectName}-OperationsAutonomyEvaluatorFunctionArn'

  EvaluatorRoleArn:
    Condition: ResourcesProvisioned
    Description: Dedicated least-privilege evaluator role ARN (no provider write).
    Value: !GetAtt EvaluatorRole.Arn
    Export:
      Name: !Sub '${ProjectName}-OperationsAutonomyEvaluatorRoleArn'
