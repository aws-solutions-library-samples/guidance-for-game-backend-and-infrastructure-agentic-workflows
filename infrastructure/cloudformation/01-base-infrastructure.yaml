AWSTemplateFormatVersion: '2010-09-09'
Description: 'Game Agent - Base Infrastructure (Cognito, IAM, ECR)'

Parameters:
  ProjectName:
    Type: String
    Default: game-agent
    Description: Project name used for resource naming

  SessionAbsoluteLifetimeHours:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 24
    Description: >-
      Absolute Cognito application-session lifetime in hours. Refresh tokens
      expire at this boundary and require a fresh user authentication.

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UserPoolTags:
        Project: !Ref ProjectName
        Environment: production
        Owner: game-agent
        CostCenter: game-infrastructure
        ManagedBy: cloudformation
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # Cognito User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref SessionAbsoluteLifetimeHours
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: hours
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # Cognito User Groups
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Administrator group with full access
      UserPoolId: !Ref UserPool
      Precedence: 1

  UsersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: users
      Description: Standard users group
      UserPoolId: !Ref UserPool
      Precedence: 10

  # ECR Repository for Backend
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub '${ProjectName}-backend'
      EmptyOnDelete: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: Owner
          Value: game-agent
        - Key: CostCenter
          Value: game-infrastructure
        - Key: ManagedBy
          Value: cloudformation
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": { "type": "expire" }
            }]
          }

  # ECR Repository for Frontend
  FrontendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub '${ProjectName}-frontend'
      EmptyOnDelete: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: production
        - Key: Owner
          Value: game-agent
        - Key: CostCenter
          Value: game-infrastructure
        - Key: ManagedBy
          Value: cloudformation
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": { "type": "expire" }
            }]
          }

  # IAM Role for AgentCore Runtime
  # Security: Uses least-privilege permissions instead of FullAccess managed policies
  AgentCoreExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-agentcore-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      # Least privilege (#482): NO account-wide AWS managed read policies.
      # AWSBillingReadOnlyAccess, AWSCloudFormationReadOnlyAccess,
      # CloudWatchReadOnlyAccess, CloudWatchLogsReadOnlyAccess, and
      # CostOptimizationHubReadOnlyAccess were removed — they allowed reading any
      # log group, stack template/parameter, and metric in the account. Every
      # action below is rebuilt from a concrete reviewed caller (see SECURITY.md,
      # "AgentCore Execution Role (Least Privilege)"). Actions a reviewed path
      # needs but that never worked on the prior role — either no prior policy
      # granted them (ce:GetUsageForecast, eks:ListInsights/DescribeInsight,
      # eks-mcpserver:QueryKnowledgeBase, ec2:DescribeRouteTables), or their only
      # caller was non-functional (the eks-mcp VPC tool shares DescribeRouteTables'
      # error path, so its ec2:DescribeVpcs/DescribeSubnets reads, granted on the
      # prior role, ran, but the tool always failed at DescribeRouteTables, so
      # their results never reached the model) — are NOT added here: that would
      # expand provider capability (out of scope). Every action that remains had
      # a caller that worked on the prior role.
      Policies:
        # Caller: Strands Bedrock model (models/cached_bedrock.py) for model
        # invocation + guardrails; kb_tools.py for direct KB retrieve;
        # optimized_prompts.py for Prompt Management GetPrompt.
        - PolicyName: BedrockScopedAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Regional foundation models
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                  # Global foundation models (region-less ARNs for newer models)
                  - 'arn:aws:bedrock:::foundation-model/*'
                  # AWS-managed cross-region inference profiles (global.* models)
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::inference-profile/*'
                  # Account-specific inference profiles
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                  # Account-specific application profiles created by profile helpers
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*'
              # Caller: kb_tools.py bedrock-agent-runtime.retrieve(). Only
              # Retrieve is called; RetrieveAndGenerate has no caller (and no
              # resource-type support in SAR), so it is removed.
              - Sid: BedrockKnowledgeBaseAccess
                Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
              # Caller: Guardrails applied on model invocation (cached_bedrock.py
              # sets guardrail_id on the Converse config => ApplyGuardrail only).
              # GetGuardrail has no caller and is removed.
              - Sid: BedrockGuardrailAccess
                Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
              - Sid: BedrockPromptManagementAccess
                Effect: Allow
                Action:
                  - bedrock:GetPrompt
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*'
        # Caller: Strands AgentCoreMemorySessionManager (STM session events) and
        # semantic_memory.py (LTM record write). The frontend invokes the runtime
        # with a Cognito bearer token over HTTPS (handled by the AgentCore
        # service), so this role self-invokes nothing: AgentCoreRuntimeAccess
        # (InvokeAgentRuntime/GetAgentRuntime) had no caller and is removed (the
        # toolkit reference grants InvokeAgentRuntime only under the A2A protocol,
        # which this runtime does not use).
        - PolicyName: AgentCoreScopedAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Least-privilege (#151, #482): scope to Game Agent memory and the
              # exact actions the session manager + semantic memory call. Memory
              # record LIFECYCLE (create/update/delete memory) stays out, so a
              # compromised runtime cannot create or destroy a memory resource, and
              # memory RECORDS cannot be deleted (no DeleteMemoryRecord /
              # BatchDeleteMemoryRecords). The session manager does delete session
              # EVENTS (DeleteEvent) when it replaces a message or migrates legacy
              # events, but only within this project's own gameagent* memory.
              # GetMemory, ListMemories, ListActors, ListSessions,
              # BatchUpdateMemoryRecords, GetMemoryRecord, and ListMemoryRecords had
              # no reviewed caller and are removed.
              - Sid: AgentCoreMemoryAccess
                Effect: Allow
                Action:
                  # STM session memory: the strands session manager
                  # creates/reads/lists/prunes events within a session.
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  # LTM: retrieve (retrieve_customer_context) + write
                  # (semantic_memory.py batch_create_memory_records). NO delete.
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:BatchCreateMemoryRecords
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/gameagent*'
        # Caller: Cost specialist (owned deterministic report + Billing MCP
        # forecast/recommendation tools), GameLift/EKS specialists, and the
        # eks-mcp VPC/metrics tools. CloudControl (legacy ccapi, replaced in #92)
        # and all unreviewed collection reads were removed.
        - PolicyName: AgentCoreServiceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Caller: owned deterministic report (ce:GetCostAndUsage,
              # cost_report.py) + Billing MCP cost-explorer forecast tool
              # (getCostForecast). The Service Authorization Reference operation
              # table lists aws-portal:ViewBilling as a dependent action of each
              # Cost Explorer read, so it is granted explicitly (it was previously
              # supplied only by the now-removed AWSBillingReadOnlyAccess managed
              # policy). ce:GetUsageForecast was granted by no policy on the prior
              # role, so usage forecasts never worked; it is NOT added here (that
              # would expand provider capability — see SECURITY.md pre-existing
              # gaps). Account-scoped exception: Cost Explorer uses the global
              # us-east-1 endpoint, so NO aws:RequestedRegion condition is applied
              # (and SAR exposes only an optional billingview resource, not a
              # per-report ARN). Historical Billing reads (GetTags/GetAnomalies/
              # GetUsageReport) were removed — they leave the reviewed
              # deterministic-report surface.
              - Sid: CostExplorerReadAccess
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - aws-portal:ViewBilling
                Resource: '*'
              # Caller: Billing MCP cost-optimization tool. Global service;
              # SAR exposes no resource types and no dependent actions.
              - Sid: CostOptimizationHubReadAccess
                Effect: Allow
                Action:
                  - cost-optimization-hub:ListRecommendationSummaries
                  - cost-optimization-hub:ListRecommendations
                  - cost-optimization-hub:GetRecommendation
                Resource: '*'
              # Caller: Billing MCP compute-optimizer tool. Only the EC2 and Auto
              # Scaling rightsizing operations are on the reviewed surface; EBS and
              # Lambda rightsizing never worked on the previous role (their
              # dependent reads were never granted) and are left off to avoid
              # expanding provider capability. Compute Optimizer is a regional
              # service, so Resource '*' is region-conditioned (unlike the global
              # Cost Explorer and Cost Optimization Hub endpoints above). The
              # Service Authorization Reference operation table and the Compute
              # Optimizer IAM user guide list ec2:DescribeInstances and the Auto
              # Scaling describes as dependent reads; they are granted below with
              # the other region-conditioned EC2/Auto Scaling collection reads.
              - Sid: ComputeOptimizerReadAccess
                Effect: Allow
                Action:
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetAutoScalingGroupRecommendations
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: Compute Optimizer dependent reads (above). Auto Scaling has
              # no scopable resource type for these describes, so Resource '*' is
              # region-conditioned.
              - Sid: AutoScalingReadAccess
                Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: GameLift specialist (gamelift_specialist.py). Exactly the
              # ten reviewed operations; every other GameLift read was removed.
              # Account-scoped exception: collection and capacity reads do not
              # support fleet-ARN scoping, so Resource '*' is region-conditioned
              # instead.
              - Sid: GameLiftReadAccess
                Effect: Allow
                Action:
                  - gamelift:ListFleets
                  - gamelift:DescribeFleetAttributes
                  - gamelift:ListContainerFleets
                  - gamelift:ListContainerGroupDefinitions
                  - gamelift:DescribeContainerFleet
                  - gamelift:DescribeContainerGroupDefinition
                  - gamelift:ListFleetDeployments
                  - gamelift:DescribeFleetUtilization
                  - gamelift:DescribeFleetCapacity
                  - gamelift:DescribeScalingPolicies
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: aws-api-mcp call_aws eks verb table (eks_mcp_guard.py) +
              # eks-mcp DescribeCluster. IdentityProviderConfig reads and
              # AccessKubernetesApi were removed (no caller; k8s API access via the
              # MCP uses an STS presigned GetCallerIdentity token, which needs no
              # IAM action). Account-scoped exception: ListClusters has no resource
              # type and cluster names are dynamic, so Resource '*' is
              # region-conditioned.
              - Sid: EKSReadAccess
                Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:DescribeCluster
                  - eks:ListNodegroups
                  - eks:DescribeNodegroup
                  - eks:ListFargateProfiles
                  - eks:DescribeFargateProfile
                  - eks:ListAddons
                  - eks:DescribeAddon
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: Compute Optimizer's ec2:DescribeInstances dependent read
              # (GetEC2InstanceRecommendations, above). EC2 describes have no
              # resource-type support (SAR), so Resource '*' is region-conditioned.
              # The eks-mcp get_eks_vpc_config tool (DescribeVpcs/DescribeSubnets/
              # DescribeRouteTables) is wholly non-functional on this role —
              # ec2:DescribeRouteTables shares its error path and was never granted
              # — so DescribeVpcs/DescribeSubnets had no working caller and were
              # removed (see SECURITY.md pre-existing gaps). DescribeSecurityGroups/
              # NetworkInterfaces were likewise removed (no caller).
              - Sid: EC2ReadAccess
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: container-mode runtime image pull (AgentCore toolkit
              # reference execution_role_policy.json.j2). direct_code_deploy does
              # not pull an image, but the toolkit prints a warning and continues
              # with container deployment when zip is missing (native-Windows
              # path), so the pull grant is retained — scoped to the
              # toolkit-created runtime repository.
              # DescribeRepositories/ListImages had no caller and were removed.
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource:
                  - !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock-agentcore-gameagentruntime'
              # ecr:GetAuthorizationToken has no resource-type support (SAR), so it
              # must be granted on '*'. Scoped by the account's own registry and
              # constrained to the deployment region.
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
        # Caller: runtime log emission + ADOT/X-Ray tracing + eks-mcp metrics
        # (AgentCore toolkit reference execution_role_policy.json.j2 and
        # CloudWatchHandler.get_cloudwatch_metrics). No runtime path reads log
        # CONTENT, so logs:GetLogEvents was removed entirely.
        - PolicyName: ObservabilityAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchLogsWrite
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/*:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/data:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/spans/*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/spans/*:*'
              # Stream metadata (NOT content) scoped to this runtime's own log
              # group. The runtime group is
              # /aws/bedrock-agentcore/runtimes/gameagentruntime-<id>-DEFAULT, so
              # the pattern is restricted to runtimes/gameagentruntime-* (not every
              # /aws/bedrock-agentcore/* group in the account).
              - Sid: CloudWatchLogsDescribeStreams
                Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/gameagentruntime-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/gameagentruntime-*:*'
              # Account-scoped exception: logs:DescribeLogGroups returns only group
              # METADATA (names/ARNs), never log content, and the AgentCore toolkit
              # reference grants it on log-group:* for group discovery. This is the
              # ONLY log read allowed on the account-wide resource.
              - Sid: CloudWatchLogsDescribeGroups
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
              # Caller: eks-mcp get_cloudwatch_metrics
              # (CloudWatchHandler.get_cloudwatch_metrics => GetMetricData).
              # GetMetricData has no scopable resource (SAR). The only caller runs
              # in the deployment region, so Resource '*' is region-conditioned.
              # GetMetricStatistics/ListMetrics had no caller and were removed.
              - Sid: CloudWatchMetricsRead
                Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Caller: ADOT/X-Ray tracing (toolkit reference). GetSamplingRules/
              # GetSamplingTargets were previously supplied only via
              # CloudWatchReadOnlyAccess (now removed) and are made explicit so the
              # sampler keeps working. None support a scopable resource (SAR).
              - Sid: XRayTracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
        # Security: Scoped shared cost report snapshot store access (#365)
        # Least-privilege: only GetItem/PutItem on this project's snapshot table.
        # No DeleteItem (TTL handles expiration) and no Scan/Query.
        - PolicyName: CostReportSnapshotStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CostReportSnapshotReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt CostReportSnapshotTable.Arn

  # IAM Role for ECS Tasks (Application Permissions)
  # Security (#458): Least Privilege Design — the frontend is a Next.js proxy,
  # and this role has ZERO identity policies. It exists only so ECS can vend task
  # credentials to the container (the AWS SDK needs a credential provider to
  # sign any call at all); it deliberately carries no inline or managed policy.
  #
  # Why zero, not "just STS": the one supported task-credential call in the
  # deployed chat path is sts:GetCallerIdentity
  # (ui/src/pages/api/copilot/chat.ts, getAccountId), used to build the
  # AgentCore runtime ARN. sts:GetCallerIdentity is a special STS action that
  # requires NO IAM allow — it returns the caller's identity even under an
  # explicit deny — so granting it would add attack surface (a real policy
  # statement to audit and drift-check) for a permission the call never needs.
  # The justified STS caller therefore does not imply an STS grant; the correct
  # least-privilege shape is an empty role.
  #
  # The dormant admin routes still reference IAM-authorized Cognito Admin/List
  # operations, but the default deployment has never granted those actions and
  # they are not a supported account-provisioning path. Issue #473 removes that
  # surface after its #469 dependency; do not grant cognito-idp permissions here.
  #
  # AgentCore is invoked with the end user's Cognito JWT as a bearer token over
  # HTTPS fetch (not the AWS SDK / SigV4), so no bedrock or bedrock-agentcore
  # grant is required. Cognito JWT verification uses aws-jwt-verify (public JWKS
  # over HTTPS, no IAM). Container stdout/stderr is shipped to CloudWatch by the
  # awslogs driver via the ECSTaskExecutionRole
  # (AmazonECSTaskExecutionRolePolicy), not this role. GameLift/EKS/Cost
  # Explorer/CloudWatch-metrics are backend/AgentCore specialist concerns with
  # no frontend caller and are intentionally NOT granted here.
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation
      # No Policies and no ManagedPolicyArns: the frontend proxy needs no
      # task-role permission (see the least-privilege rationale above). The role
      # is retained solely as the task credential provider.

  # IAM Role for ECS Task Execution (ECR pulls + CloudWatch logs)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-task-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # IAM Role for ECS Infrastructure (ALB, security groups, auto-scaling)
  ECSInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ecs-infrastructure-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: cloudformation

  # Security: S3 Access Logging Bucket (BSC43)
  # Stores access logs for all project S3 buckets
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-access-logs-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: access-logging
        - Key: ManagedBy
          Value: cloudformation

  # Bucket policy to allow S3 service to write access logs
  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-*'
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # Shared snapshot store for deterministic cross-worker cost report reuse (#365)
  # On-demand table so a report ID created by one AgentCore worker resolves from
  # any worker for the configured TTL. Snapshots expire automatically via the
  # 'expiresAt' TTL attribute; the runtime uses only GetItem/PutItem (no scans).
  CostReportSnapshotTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${ProjectName}-cost-report-snapshots'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      # Encryption at rest (in transit is enforced by the HTTPS DynamoDB endpoint)
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Purpose
          Value: cost-report-snapshots
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${ProjectName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${ProjectName}-UserPoolClientId'

  SessionAbsoluteLifetimeHours:
    Description: Configured absolute Cognito session lifetime in hours
    Value: !Ref SessionAbsoluteLifetimeHours
    Export:
      Name: !Sub '${ProjectName}-SessionAbsoluteLifetimeHours'

  BackendRepositoryUri:
    Description: Backend ECR Repository URI
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-BackendRepositoryUri'

  FrontendRepositoryUri:
    Description: Frontend ECR Repository URI
    Value: !GetAtt FrontendRepository.RepositoryUri
    Export:
      Name: !Sub '${ProjectName}-FrontendRepositoryUri'

  AgentCoreExecutionRoleArn:
    Description: AgentCore Execution Role ARN
    Value: !GetAtt AgentCoreExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-AgentCoreExecutionRoleArn'

  ECSTaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-ECSTaskExecutionRoleArn'

  ECSInfrastructureRoleArn:
    Description: ECS Infrastructure Role ARN
    Value: !GetAtt ECSInfrastructureRole.Arn
    Export:
      Name: !Sub '${ProjectName}-ECSInfrastructureRoleArn'

  ECSTaskRoleArn:
    Description: ECS Task Role ARN
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub '${ProjectName}-ECSTaskRoleArn'

  AccessLogsBucketName:
    Description: S3 Access Logs Bucket Name
    Value: !Ref AccessLogsBucket
    Export:
      Name: !Sub '${ProjectName}-AccessLogsBucketName'

  CostReportSnapshotTableName:
    Description: DynamoDB table for shared cost report snapshots
    Value: !Ref CostReportSnapshotTable
    Export:
      Name: !Sub '${ProjectName}-CostReportSnapshotTableName'
