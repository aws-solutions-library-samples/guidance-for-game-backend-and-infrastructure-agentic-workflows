AWSTemplateFormatVersion: '2010-09-09'
Description: 'Game Agent - EKS Knowledge Base with S3 Vectors'

Parameters:
  ProjectName:
    Type: String
    Default: game-agent
    Description: Project name for resource naming
  EmbeddingDimension:
    Type: Number
    Default: 1024
    AllowedValues:
      - 256
      - 512
      - 1024
    Description: Titan Embed v2 dimension (256/512/1024). Lower = cheaper and faster, higher = better retrieval quality.

Resources:
  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      VectorBucketName: !Sub '${ProjectName}-kb-eks-vectors'
      EncryptionConfiguration:
        SseType: AES256

  VectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      IndexName: !Sub '${ProjectName}-eks-index'
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      Dimension: !Ref EmbeddingDimension
      DataType: float32
      DistanceMetric: cosine
      # Bedrock stores chunk text in AMAZON_BEDROCK_TEXT and chunk metadata in
      # AMAZON_BEDROCK_METADATA. S3 Vectors treats metadata as filterable by
      # default, and filterable metadata is capped at 2048 bytes/vector — dense
      # chunks exceed it and fail ingestion. Mark these Bedrock-managed keys
      # non-filterable so chunk text is retrievable-but-not-filterable and the
      # cap no longer applies. This is the robust fix for the interim MaxTokens
      # workaround below. (Issue #313.)
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_METADATA
          - AMAZON_BEDROCK_TEXT

  DocumentBucket:
    Type: AWS::S3::Bucket
    # No DeletionPolicy - let CloudFormation manage full lifecycle
    # Docs are ephemeral (scraped from AWS) and can be re-downloaded
    Properties:
      BucketName: !Sub '${ProjectName}-kb-eks-docs-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Security: Enable S3 access logging (BSC43)
      LoggingConfiguration:
        DestinationBucketName:
          Fn::ImportValue: !Sub '${ProjectName}-AccessLogsBucketName'
        LogFilePrefix: !Sub 'kb-eks-docs/'

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-kb-eks-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DocumentBucket.Arn
                  - !Sub '${DocumentBucket.Arn}/*'
        - PolicyName: S3VectorsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3vectors:QueryVectors
                  - s3vectors:GetVectors
                  - s3vectors:PutVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:GetVectorBucket
                  - s3vectors:PutVectorBucketPolicy
                  - s3vectors:GetVectorBucketPolicy
                Resource:
                  - !GetAtt VectorBucket.VectorBucketArn
                  - !Sub '${VectorBucket.VectorBucketArn}/*'
        - PolicyName: BedrockEmbeddings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: VectorIndex
    Properties:
      Name: !Sub '${ProjectName}-eks-kb'
      Description: 'EKS documentation knowledge base'
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0'
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
          IndexName: !Sub '${ProjectName}-eks-index'

  DataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      # Name suffix bumped (-v2) alongside the chunking change below. Bedrock
      # treats chunking config as immutable, so changing it forces a data-source
      # replacement; a fixed name would collide (AlreadyExists) because CFN
      # creates the replacement before deleting the old one. Bump the suffix
      # whenever the chunking config changes.
      Name: !Sub '${ProjectName}-eks-docs-v2'
      Description: 'EKS documentation'
      KnowledgeBaseId: !Ref KnowledgeBase
      # DELETE so that when the data source is replaced (e.g. to change the
      # immutable chunking config), Bedrock purges the old vectors from the
      # index instead of orphaning them. Docs are ephemeral (re-scraped), so
      # retaining vectors provides no value.
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt DocumentBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            # Restored to 256 (from the interim 120 workaround) now that the
            # vector index marks AMAZON_BEDROCK_TEXT/METADATA non-filterable, so
            # the 2048-byte filterable-metadata cap no longer constrains chunk
            # text (issue #313). Larger chunks give better retrieval context.
            # Re-run seed-kb-eks.sh after deploy to re-chunk.
            MaxTokens: 256
            OverlapPercentage: 10

Outputs:
  KnowledgeBaseId:
    Description: EKS Knowledge Base ID
    Value: !Ref KnowledgeBase
    Export:
      Name: !Sub '${ProjectName}-eks-kb-id'

  KnowledgeBaseArn:
    Description: EKS Knowledge Base ARN
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn
    Export:
      Name: !Sub '${ProjectName}-eks-kb-arn'

  DataSourceId:
    Description: Data Source ID
    Value: !Ref DataSource
    Export:
      Name: !Sub '${ProjectName}-eks-kb-datasource-id'

  DocumentBucketName:
    Description: S3 Bucket for source documents
    Value: !Ref DocumentBucket
    Export:
      Name: !Sub '${ProjectName}-eks-kb-bucket'

  VectorBucketArn:
    Description: S3 Vector Bucket ARN
    Value: !GetAtt VectorBucket.VectorBucketArn
    Export:
      Name: !Sub '${ProjectName}-eks-kb-vector-bucket-arn'
