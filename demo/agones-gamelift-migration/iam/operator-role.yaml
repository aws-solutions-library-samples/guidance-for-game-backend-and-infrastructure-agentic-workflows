AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Operator role for the Agones-to-GameLift reference environment. Use it only in
  a dedicated sandbox account with no other workloads; that account, not this
  policy, is what contains EC2: the eksctl minimum applies to every EC2
  resource in the Region. Every role it creates must carry the workload
  boundary below, which is the effective ceiling for code the operator runs on
  instances it launches. Its CloudFormation, EKS, GameLift, ECR, and IAM role
  permissions are scoped by name or tag. It is never used by the assistant.

Parameters:
  OperatorPrincipalArn:
    Type: String
    Description: IAM role or user ARN allowed to assume this role (the person or pipeline running the demo).
    AllowedPattern: "^arn:aws[a-z-]*:iam::[0-9]{12}:(role|user)/.+$"
  ClusterName:
    Type: String
    Default: agones-demo
    Description: EKS cluster name; also the demo-env tag value that scopes GameLift resources.
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
  StackPrefix:
    Type: String
    Default: gl-demo
    Description: Name prefix of the GameLift container-fleet stacks and their IAM roles.
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
  RepositoryName:
    Type: String
    Default: agones-gamelift-demo/game-server
    AllowedPattern: "^[a-z0-9][a-z0-9/_-]{2,100}$"
  AgentRoleName:
    Type: String
    Default: game-agent-agentcore-execution-role
    Description: The assistant's runtime role, which enroll-agent maps to read-only Kubernetes access.
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

Resources:
  # Ceiling for every role this environment creates (EKS cluster role, node
  # role, GameLift fleet roles). This boundary, not the attach allowlist, is
  # the effective limit: the operator can write its own eksctl-<cluster>-*
  # policy, attach it to a bounded role, and run code with that role on an
  # instance it launches. The boundary covers the services the allowlisted AWS
  # managed policies use and nothing else: no IAM beyond service-linked roles,
  # no Systems Manager commands, no S3 reads, EKS reads of this cluster only,
  # and this Region only. It denies the most direct EC2 routes to running code
  # as another role, but not all of them (launch template versions, root
  # volume replacement, and volume swaps remain), so the dedicated account is
  # what contains EC2. AmazonEKSClusterPolicy lists
  # ec2:ModifyInstanceAttribute for load balancer security groups; this
  # environment creates no load balancers, so the deny costs nothing here.
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ClusterName}-workload-boundary"
      Description: Permissions boundary for roles created by the Agones-to-GameLift reference environment.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EksClusterAndNodes
            Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - autoscaling:*
              - kms:CreateGrant
              - kms:DescribeKey
              - iam:CreateServiceLinkedRole
            Resource: "*"
          # AmazonEKSWorkerNodePolicy's EKS actions, for this cluster only.
          - Sid: EksThisClusterOnly
            Effect: Allow
            Action:
              - eks:DescribeCluster
              - eks-auth:AssumeRoleForPodIdentity
            Resource: !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
          - Sid: PullImages
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:DescribeImages
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:GetRepositoryPolicy
              - ecr:GetLifecyclePolicy
              - ecr:GetLifecyclePolicyPreview
              - ecr:ListTagsForResource
              - ecr:DescribeImageScanFindings
            Resource: "*"
          - Sid: NodeManagementAgent
            Effect: Allow
            Action:
              - ssm:DescribeAssociation
              - ssm:GetDeployablePatchSnapshotForInstance
              - ssm:GetDocument
              - ssm:DescribeDocument
              - ssm:GetManifest
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListAssociations
              - ssm:ListInstanceAssociations
              - ssm:PutInventory
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssmmessages:*
              - ec2messages:*
            Resource: "*"
          - Sid: GameLiftFleetRuntime
            Effect: Allow
            Action:
              - gamelift:GetComputeAuthToken
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:PutRetentionPolicy
              - s3:PutObject
              - s3:GetBucketLocation
              - cloudwatch:PutMetricData
            Resource: "*"
          - Sid: DenyCodeExecutionAsOtherRoles
            Effect: Deny
            Action:
              - ec2:ModifyInstanceAttribute
              - ec2:ModifySnapshotAttribute
              - ec2:ModifyImageAttribute
              - ec2:CreateSnapshot
              - ec2:CreateSnapshots
              - ec2:GetPasswordData
            Resource: "*"
          - Sid: DenyOtherRegions
            Effect: Deny
            NotAction:
              - iam:*
              - sts:*
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:RequestedRegion: !Ref AWS::Region

  OperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-operator"
      Description: Operator role for the Agones-to-GameLift reference environment (dedicated sandbox account only).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref OperatorPrincipalArn
            Action: sts:AssumeRole
      # No demo-env tag: the role outlives `demo.sh down`, which must not find
      # it, and is deleted last with the operator's own credentials.
      Tags:
        - Key: demo
          Value: agones-gamelift-migration
      Policies:
        - PolicyName: demo-operator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ----------------------------------------------------------------
              # Guard rails
              # ----------------------------------------------------------------
              - Sid: DenyOtherRegions
                Effect: Deny
                NotAction:
                  - iam:*
                  - sts:*
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: DenyCodeExecutionAsOtherRoles
                Effect: Deny
                Action:
                  - ec2:ModifyInstanceAttribute
                  - ec2:ModifySnapshotAttribute
                  - ec2:ModifyImageAttribute
                  - ec2:CreateSnapshot
                  - ec2:CreateSnapshots
                  - ec2:GetPasswordData
                  - ec2:CreateVpcPeeringConnection
                  - ec2:AcceptVpcPeeringConnection
                  - ec2:CreateVpnConnection
                  - ec2:CreateVpnGateway
                  - ec2:AttachVpnGateway
                  - ec2:CreateCustomerGateway
                  - ec2:CreateTransitGatewayVpcAttachment
                  - ec2:AcceptTransitGatewayVpcAttachment
                Resource: "*"
              - Sid: DenyBoundaryRemovalOrReplacement
                Effect: Deny
                Action: iam:DeleteRolePermissionsBoundary
                Resource: "*"
              - Sid: DenyOtherBoundaries
                Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource: "*"
                Condition:
                  StringNotEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Sid: DenyChangesToProtectedIdentities
                Effect: Deny
                Action:
                  - iam:Attach*
                  - iam:Put*
                  - iam:Update*
                  - iam:Delete*
                  - iam:Detach*
                  - iam:CreatePolicyVersion
                  - iam:SetDefaultPolicyVersion
                  - iam:Tag*
                  - iam:Untag*
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AgentRoleName}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ClusterName}-operator"
                  - !Ref WorkloadBoundary

              # ----------------------------------------------------------------
              # EC2 for eksctl (VPC, subnets, NAT gateway, security groups,
              # launch templates, node instances). This is the eksctl minimum
              # and is not resource-scoped; hence the dedicated-account rule.
              # ----------------------------------------------------------------
              - Sid: Ec2ForEksctl
                Effect: Allow
                Action:
                  - ec2:*
                  - elasticloadbalancing:Describe*
                  - autoscaling:Describe*
                Resource: "*"

              - Sid: CloudFormationDemoStacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eksctl-${ClusterName}-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}-*/*"
              - Sid: CloudFormationReadAndValidate
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:DescribeType
                  - cloudformation:DescribeEvents
                Resource: "*"

              - Sid: EksDemoCluster
                Effect: Allow
                Action: eks:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
                  - !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/${ClusterName}/*/*"
                  - !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:addon/${ClusterName}/*/*"
                  - !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:access-entry/${ClusterName}/*"
                  - !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:podidentityassociation/${ClusterName}/*"
                  - !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/*"
              - Sid: EksAccountReads
                Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:DescribeAddonVersions
                  - eks:DescribeAddonConfiguration
                  - eks:DescribeClusterVersions
                  - eks:ListAccessPolicies
                Resource: "*"
              - Sid: EksAmiLookup
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/*"
              - Sid: EksctlLogRetention
                Effect: Allow
                Action: logs:PutRetentionPolicy
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/eks/${ClusterName}/*"
              # Fleet log groups the reference template creates and deletes
              # (AWS::Logs::LogGroup handler actions), scoped to this prefix.
              - Sid: FleetLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                  - logs:GetDataProtectionPolicy
                  - logs:DeleteDataProtectionPolicy
                  - logs:DescribeIndexPolicies
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:gamelift-${StackPrefix}-*"
              # The default gamelift-<fleet ID>-<Region> group that `down`
              # removes for each fleet it deletes. Fleet IDs are generated, so
              # this is scoped by the name pattern only, and only for deletion.
              - Sid: DeleteDefaultFleetLogGroups
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:gamelift-containerfleet-*"
              - Sid: ListLogGroups
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                Resource: "*"

              # ----------------------------------------------------------------
              # IAM: only the roles this environment creates, always under the
              # workload boundary, with an allowlist of attachable policies.
              # ----------------------------------------------------------------
              - Sid: IamCreateBoundedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePermissionsBoundary
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Sid: IamAttachAllowlistedPolicies
                Effect: Allow
                Action: iam:AttachRolePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
                  ArnLike:
                    iam:PolicyARN:
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSVPCResourceController"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
                      - !Sub "arn:${AWS::Partition}:iam::aws:policy/GameLiftContainerFleetPolicy"
                      - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/eksctl-${ClusterName}-*"
              # eksctl may add inline policies to its own roles; GameLift
              # stack roles get none.
              - Sid: IamInlinePoliciesOnEksctlRolesOnly
                Effect: Allow
                Action: iam:PutRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-*"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Sid: IamManageDemoRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:DetachRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:UpdateRoleDescription
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/eksctl-${ClusterName}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*"
              - Sid: PassDemoRolesToTheirServices
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/eksctl-${ClusterName}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - eks.amazonaws.com
                      - ec2.amazonaws.com
                      - gamelift.amazonaws.com
              # enroll-agent resolves the assistant's role ARN; it never changes that role.
              - Sid: ReadAgentRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AgentRoleName}"
              # EKS checks whether its service-linked roles already exist using
              # the caller's permissions before it creates a cluster or node group.
              - Sid: ReadEksServiceLinkedRoles
                Effect: Allow
                Action: iam:GetRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks.amazonaws.com/*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks-nodegroup.amazonaws.com/*"
              - Sid: EksctlManagedPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:ListPolicyVersions
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/eksctl-${ClusterName}-*"
              - Sid: IamReadPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::aws:policy/*"
                  - !Ref WorkloadBoundary
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - eks.amazonaws.com
                      - eks-nodegroup.amazonaws.com
                      - autoscaling.amazonaws.com

              # ----------------------------------------------------------------
              # GameLift: every create must carry this environment's demo-env
              # tag. GameLift authorizes creates against "<type>/*" (verified
              # live for container group definitions), so a create cannot be
              # scoped by name; changes and deletes are. Container group
              # definitions and queues can be changed or deleted only under
              # <prefix>-* names, and fleets, whose ARNs hold a generated ID,
              # only while they carry the demo-env tag. The actions are the
              # CloudFormation registry handler permissions for ContainerFleet,
              # ContainerGroupDefinition, and GameSessionQueue.
              # ----------------------------------------------------------------
              - Sid: GameLiftCreateTagged
                Effect: Allow
                Action:
                  - gamelift:CreateContainerGroupDefinition
                  - gamelift:CreateGameSessionQueue
                  - gamelift:CreateContainerFleet
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/demo-env: !Ref ClusterName
              # Tagging must not bring another environment's resource into
              # scope: a resource that already has a demo-env tag can be tagged
              # only if it is this environment's. On create the resource has no
              # tags yet, so the IfExists condition passes. A GameLift resource
              # with no demo-env tag at all could still be adopted; the
              # dedicated account is what rules that out.
              - Sid: GameLiftTagThisEnvironmentOnly
                Effect: Allow
                Action: gamelift:TagResource
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/demo-env: !Ref ClusterName
                  StringEqualsIfExists:
                    aws:ResourceTag/demo-env: !Ref ClusterName
              # No tag condition: a rollback deletes definitions it never
              # finished creating, which carry no tags yet.
              - Sid: GameLiftChangeNamedOnly
                Effect: Allow
                Action:
                  - gamelift:UpdateContainerGroupDefinition
                  - gamelift:DeleteContainerGroupDefinition
                  - gamelift:UpdateGameSessionQueue
                  - gamelift:DeleteGameSessionQueue
                  - gamelift:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:gamelift:${AWS::Region}:${AWS::AccountId}:containergroupdefinition/${StackPrefix}-*"
                  - !Sub "arn:${AWS::Partition}:gamelift:${AWS::Region}:${AWS::AccountId}:gamesessionqueue/${StackPrefix}-*"
              - Sid: GameLiftChangeTaggedFleetsOnly
                Effect: Allow
                Action:
                  - gamelift:UpdateContainerFleet
                  - gamelift:DeleteContainerFleet
                  - gamelift:CreateFleetLocations
                  - gamelift:DeleteFleetLocations
                  - gamelift:UpdateFleetCapacity
                  - gamelift:StartFleetActions
                  - gamelift:StopFleetActions
                  - gamelift:PutScalingPolicy
                  - gamelift:DeleteScalingPolicy
                  - gamelift:UntagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:gamelift:${AWS::Region}:${AWS::AccountId}:containerfleet/*"
                  - !Sub "arn:${AWS::Partition}:gamelift:${AWS::Region}:${AWS::AccountId}:fleet/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/demo-env: !Ref ClusterName
              # CreateGameSession has no resource type or condition keys in the
              # Service Authorization Reference, so it cannot be scoped. It
              # starts a session on an existing fleet's server process and
              # changes no infrastructure; the dedicated-account rule covers it.
              - Sid: GameLiftStartTestSessions
                Effect: Allow
                Action: gamelift:CreateGameSession
                Resource: "*"
              - Sid: GameLiftReads
                Effect: Allow
                Action:
                  - gamelift:DescribeContainerGroupDefinition
                  - gamelift:ListContainerGroupDefinitions
                  - gamelift:DescribeContainerFleet
                  - gamelift:ListContainerFleets
                  - gamelift:DescribeFleetDeployment
                  - gamelift:DescribeFleetLocationAttributes
                  - gamelift:DescribeFleetLocationCapacity
                  - gamelift:DescribeFleetCapacity
                  - gamelift:DescribeScalingPolicies
                  - gamelift:DescribeGameSessionQueues
                  - gamelift:DescribeGameSessions
                  - gamelift:ListTagsForResource
                Resource: "*"

              - Sid: EcrDemoRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:ListTagsForResource
                  - ecr:BatchGetImage
                  - ecr:BatchDeleteImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:TagResource
                  - ecr:PutImageScanningConfiguration
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"

              - Sid: ResourceDiscoveryForCleanupCheck
                Effect: Allow
                Action:
                  - tag:GetResources
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  OperatorRoleArn:
    Value: !GetAtt OperatorRole.Arn
  WorkloadBoundaryArn:
    Description: Permissions boundary that demo.sh, eksctl, and the GameLift stacks attach to every role they create.
    Value: !Ref WorkloadBoundary
