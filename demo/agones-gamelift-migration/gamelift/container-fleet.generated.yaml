AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GameLift Container Fleet migration from Agones/EKS (simple-game-server, UDP 7654).
  Includes ContainerGroupDefinition, ContainerFleet, IAM role, GameSessionQueue,
  and a TargetBased scaling policy targeting PercentAvailableGameSessions.

Parameters:
  # ?? Required ??????????????????????????????????????????????????????????????
  ContainerImageUri:
    Type: String
    Description: >
      ECR image URI for the simple-game-server container
      e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/simple-game-server:latest

  # ?? Optional (all have working defaults) ??????????????????????????????????
  ContainerGroupName:
    Type: String
    Default: simple-game-server-cgd
    Description: Name for the ContainerGroupDefinition

  FleetDescription:
    Type: String
    Default: "Simple Game Server ? migrated from Agones/EKS"

  InstanceType:
    Type: String
    Default: c6i.large
    Description: EC2 instance type for the container fleet

  TotalVcpuLimit:
    Type: Number
    Default: 1.0
    Description: vCPU limit per container group (fractional allowed)

  TotalMemoryLimitMebibytes:
    Type: Number
    Default: 1024
    Description: Memory limit in MiB per container group

  # Target % of game session slots that should remain available (scale-out trigger)
  ScalingTargetValue:
    Type: Number
    Default: 30
    Description: >
      Target percentage of available (unfilled) game session slots.
      GameLift scales out when availability drops below this value.

  QueueTimeoutSeconds:
    Type: Number
    Default: 120
    Description: Seconds before a placement request times out

Resources:

  # ?? IAM Role ??????????????????????????????????????????????????????????????
  # Trusted by gamelift.amazonaws.com; uses the exact managed policy name
  # required for container fleets (GameLiftContainerFleetPolicy).
  FleetIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-gamelift-fleet-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: gamelift.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Partition-aware ARN ? works in aws, aws-cn, aws-us-gov
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/GameLiftContainerFleetPolicy"

  # ?? Container Group Definition ????????????????????????????????????????????
  # Mirrors the Agones simple-game-server: Linux, UDP 7654, 1 vCPU, 1 GiB RAM.
  # ServerSdkVersion 5.2.0 is the minimum required for container fleets.
  GameServerContainerGroupDefinition:
    Type: AWS::GameLift::ContainerGroupDefinition
    Properties:
      Name: !Ref ContainerGroupName
      OperatingSystem: AMAZON_LINUX_2023
      TotalMemoryLimitMebibytes: !Ref TotalMemoryLimitMebibytes
      TotalVcpuLimit: !Ref TotalVcpuLimit
      GameServerContainerDefinition:
        ContainerName: simple-game-server
        ImageUri: !Ref ContainerImageUri   # supply your ECR URI at deploy time
        ServerSdkVersion: "5.2.0"
        PortConfiguration:
          ContainerPortRanges:
            # Exact port from your Agones fleet ? UDP 7654
            - FromPort: 7654
              ToPort: 7654
              Protocol: UDP

  # ?? Container Fleet ???????????????????????????????????????????????????????
  # InstanceConnectionPortRange and InstanceInboundPermissions are intentionally
  # OMITTED: GameLift auto-computes the connection port range and opens it to
  # players. Manually setting the port range without inbound permissions would
  # leave the fleet unreachable.
  ContainerFleet:
    Type: AWS::GameLift::ContainerFleet
    Properties:
      Description: !Ref FleetDescription
      FleetRoleArn: !GetAtt FleetIAMRole.Arn
      GameServerContainerGroupDefinitionName: !Ref ContainerGroupName
      InstanceType: !Ref InstanceType
      # Single home Region (the stack Region).
      # Add more Locations entries for multi-Region expansion later.
      Locations:
        - Location: !Ref AWS::Region
          LocationCapacity:
            MinSize: 1      # always keep ?1 instance warm (best practice ?5)
            MaxSize: 10     # hard ceiling; raise for launch day (best practice ?5)
            DesiredEC2Instances: 2
      # Protect in-progress game sessions from being terminated during scale-in
      NewGameSessionProtectionPolicy: FullProtection
      # Target-based auto-scaling: keep ScalingTargetValue % of slots available.
      # GameLift scales out when availability drops below target (best practice ?2).
      ScalingPolicies:
        - Name: TargetAvailableGameSessions   # use Name, not PolicyName
          PolicyType: TargetBased
          MetricName: PercentAvailableGameSessions
          TargetConfiguration:
            TargetValue: !Ref ScalingTargetValue
    DependsOn: GameServerContainerGroupDefinition

  # ?? Game Session Queue ????????????????????????????????????????????????????
  # Single destination: the container fleet above.
  # PriorityConfiguration is omitted because PriorityOrder does not include
  # LOCATION, so LocationOrder must not be set (would cause a validation error).
  GameSessionQueue:
    Type: AWS::GameLift::GameSessionQueue
    Properties:
      Name: !Sub "${AWS::StackName}-queue"
      TimeoutInSeconds: !Ref QueueTimeoutSeconds
      Destinations:
        - DestinationArn: !GetAtt ContainerFleet.FleetArn
    DependsOn: ContainerFleet

Outputs:
  FleetId:
    Description: GameLift Container Fleet ID
    Value: !Ref ContainerFleet

  FleetArn:
    Description: GameLift Container Fleet ARN
    Value: !GetAtt ContainerFleet.FleetArn

  QueueArn:
    Description: Game Session Queue ARN
    Value: !GetAtt GameSessionQueue.Arn

  ContainerGroupDefinitionArn:
    Description: Container Group Definition ARN
    Value: !GetAtt GameServerContainerGroupDefinition.ContainerGroupDefinitionArn
