# eksctl config for the Agones-to-GameLift reference environment.
#
# Private by default:
#   * Worker nodes run in private subnets and reach the internet only through a
#     single NAT gateway. Nothing in the cluster has a public game port.
#   * The Kubernetes API is reachable publicly only from OPERATOR_CIDR (your
#     workstation's /32), plus privately from inside the VPC.
#
# Placeholders (double-underscore names) are filled in by `scripts/demo.sh cluster-up`; do not
# pass this file to eksctl directly.
#
# Compatibility: EKS 1.35 is in standard support and inside the range Agones
# 1.61 supports (1.34-1.36). Tested with eksctl 0.231.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: __CLUSTER_NAME__
  region: __REGION__
  version: "1.35"
  tags:
    demo: agones-gamelift-migration
    demo-env: __CLUSTER_NAME__
    owner: __OWNER__
    expires-at: __EXPIRES_AT__
vpc:
  nat:
    gateway: Single
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs:
    - __OPERATOR_CIDR__
iam:
  withOIDC: false
accessConfig:
  authenticationMode: API
managedNodeGroups:
  - name: gameservers
    instanceType: m5.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 30
    privateNetworking: true
    disableIMDSv1: true
    labels:
      agones.dev/role: gameserver
    tags:
      demo: agones-gamelift-migration
      demo-env: __CLUSTER_NAME__
      owner: __OWNER__
      expires-at: __EXPIRES_AT__
