[project]
name = "game-agent-backend"
version = "1.0.0"
description = "AI-powered game server management backend"
requires-python = ">=3.13.9"
dependencies = [
    # Strands packages with OTEL support
    "strands-agents[otel]>=1.19.0",
    "strands-agents-tools>=0.2.17",

    # MCP client - Pinned to <1.19.0 due to eks-mcp-server incompatibility
    # See: https://github.com/awslabs/mcp/issues/1577
    "mcp>=1.11.0,<1.19.0",

    # AWS SDK
    "boto3>=1.40.75",
    "botocore>=1.40.75",

    # Environment variables
    "python-dotenv>=1.1.1",

    # JWT authentication
    "PyJWT[crypto]>=2.8.0",

    # AgentCore SDK with Strands integration
    "bedrock-agentcore[strands-agents]>=1.0.6",

    # HTTP client with AWS SigV4 signing
    "httpx>=0.28.1",
    "httpx-auth-awssigv4>=0.1.4",

    # Utilities
    "pydantic>=2.11.9",
    "loguru>=0.7.3",
    "PyYAML>=6.0.1",

    # OpenTelemetry / ADOT for AgentCore observability
    "aws-opentelemetry-distro>=0.14.0",
    "opentelemetry-instrumentation>=0.54b0",

    # Process monitoring
    "psutil>=6.1.0",

    # AWS Labs MCP Servers - stdio transport
    "awslabs.ccapi-mcp-server>=1.0.8",
    "awslabs.cost-explorer-mcp-server>=0.0.12",
    "awslabs.eks-mcp-server==0.1.14",
    "awslabs.core-mcp-server==1.0.7",

    # Documentation scraper dependencies
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "pypdf>=5.1.0",
]

[dependency-groups]
dev = [
    # CLI/interactive tools (not needed in production)
    "strands-agents-builder>=0.1.10",
    "bedrock-agentcore-starter-toolkit>=0.1.33",
    "uv>=0.8.22",

    # Testing
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.3.1",

    # Code quality tools
    "pre-commit>=4.0.1",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.13.0",
]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]
known_first_party = ["agents", "config", "models", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
import_heading_stdlib = "Standard library"
import_heading_thirdparty = "Third-party packages"
import_heading_firstparty = "Local modules"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
strict_optional = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
