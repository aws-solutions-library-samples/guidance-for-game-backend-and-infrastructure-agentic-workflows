[project]
name = "game-agent-backend"
version = "1.0.0"
description = "AI-powered game server management backend"
requires-python = ">=3.13.9,<3.14"
dependencies = [
    # Strands packages with OTEL support
    "strands-agents[otel]>=1.50.2",
    "strands-agents-tools>=0.8.5",

    # MCP client. Previously pinned <1.19.0 due to an eks-mcp-server
    # incompatibility (awslabs/mcp#1577: mcp 1.19 added stricter type
    # validation that broke eks-mcp-server's Union[CallToolResult] pattern).
    # Fixed upstream: eks-mcp-server>=0.1.32 now requires mcp[cli]>=1.23.0,
    # which also resolves GHSA-9h52-p55h-vw2f. Floor raised accordingly.
    "mcp>=1.28.1",

    # AWS SDK. Floors at 1.43.32 (not .33) so the resolver can satisfy the
    # awscli==1.45.32 bundled by awslabs.aws-api-mcp-server, which pins
    # botocore==1.43.32 exactly.
    "boto3>=1.43.32",
    "botocore>=1.43.32",

    # Environment variables
    "python-dotenv>=1.2.2",

    # JWT authentication (floor raised to the patched version, CVE fix)
    "PyJWT[crypto]>=2.13.0",

    # AgentCore SDK with Strands integration
    "bedrock-agentcore[strands-agents]>=1.19.0",

    # HTTP client with AWS SigV4 signing
    "httpx>=0.28.1",
    "httpx-auth-awssigv4>=0.1.4",

    # Utilities
    "pydantic>=2.13.4",
    "loguru>=0.7.3",
    "PyYAML>=6.0.1",
    "cachetools>=6.2.4",  # bounded TTL caches (rate-limit, KB, memory dedup)

    # OpenTelemetry / ADOT for AgentCore observability
    "aws-opentelemetry-distro>=0.19.0",
    "opentelemetry-instrumentation>=0.65b0",

    # Process monitoring
    "psutil>=7.2.2",

    # AWS Labs MCP Servers - stdio transport
    # (core-mcp-server removed: it was never imported/launched by this codebase
    #  and pulled a large unused tree of other awslabs servers.)
    # aws-api-mcp-server replaces the YANKED ccapi-mcp-server (issue #92): it's an
    # AWS CLI bridge (call_aws) used by the EKS specialist for cluster discovery
    # (`aws eks list-clusters`). Its log/workdir are redirected to /tmp via env in
    # mcp_client_factory.create_mcp_client (it writes under $HOME otherwise).
    # Floor at 1.3.47: 1.3.46 is affected by GHSA-29w2-fq35-v728 (High).
    "awslabs.aws-api-mcp-server>=1.4.1",
    # Replaces the YANKED awslabs.cost-explorer-mcp-server (#105). Its SQLite
    # session DB path is hardcoded in the package dir (read-only on container);
    # mcp_client_factory relocates it to /tmp via a startup patch.
    "awslabs.billing-cost-management-mcp-server>=0.0.29",
    "awslabs.eks-mcp-server>=0.1.35",

    # Documentation scraper dependencies
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "html2text>=2024.2.26",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    # CLI/interactive tools (not needed in production)
    "strands-agents-builder>=0.1.10",
    "bedrock-agentcore-starter-toolkit>=0.3.11",
    "uv>=0.12.0",

    # Testing
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3.1",

    # Code quality tools
    "pre-commit>=4.6.1",
    "black>=26.5.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]
known_first_party = ["agents", "config", "models", "utils"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
import_heading_stdlib = "Standard library"
import_heading_thirdparty = "Third-party packages"
import_heading_firstparty = "Local modules"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
check_untyped_defs = true
strict_optional = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
