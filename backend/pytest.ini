[pytest]
pythonpath = src tests
markers =
    localhost: marks tests that run locally without deployment (fast, <30s)
    cloud: marks tests that require deployed stack (integration, AI, performance)
    integration: marks tests as integration tests (may require external services)
    e2e: marks tests as end-to-end tests (requires full stack running)
    slow: marks tests as slow running (>30s)
    unit: marks tests as unit tests (fast, no external dependencies)
    fast: marks tests as fast (<1s)
    medium: marks tests as medium (1-10s)
    timeout: mark test with timeout
    mcp: marks tests that use MCP clients
    ai_eval: marks tests as AI evaluation tests
    stress: marks tests as stress/performance tests (high load, timing critical)

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout settings
timeout = 30
timeout_method = thread

# Output settings
addopts =
    --strict-markers
    --tb=short
    --maxfail=5
    -v
